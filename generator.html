        function generateAndDownloadHTML() {
            const jsonInput = document.getElementById('json-input').value;
            const errorMsg = document.getElementById('error-msg');
            const quizTitle = document.getElementById('quiz-title').value || "क्विज़";
            const backLink = document.getElementById('back-link').value || "#";
            
            let rawJson;
            try {
                rawJson = JSON.parse(jsonInput);
                if (!Array.isArray(rawJson)) {
                    throw new Error("JSON Array के रूप में होना चाहिए।");
                }
                errorMsg.classList.add('hidden');
            } catch (e) {
                errorMsg.innerText = "Error: Invalid JSON format.\n(" + e.message + ")";
                errorMsg.classList.remove('hidden');
                return;
            }

            let parsedJson = rawJson.map((item, idx) => {
                let qText = item.question || item.q || "प्रश्न उपलब्ध नहीं";
                let optsArray = [];
                let correctIndex = -1;

                if (item.options && typeof item.options === 'object' && !Array.isArray(item.options)) {
                    const keys = Object.keys(item.options);
                    optsArray = keys.map(k => item.options[k]);
                    
                    if (item.answer) {
                        correctIndex = keys.indexOf(item.answer.toLowerCase());
                    }
                } 
                else if (Array.isArray(item.options)) {
                    optsArray = item.options;
                    correctIndex = item.correct !== undefined ? item.correct : -1;
                }

                return {
                    id: item.id || idx + 1,
                    q: qText,
                    options: optsArray,
                    correct: correctIndex
                };
            });

            parsedJson = parsedJson.filter(item => item.options.length > 0 && !item.q.startsWith("**Identify"));

            if(parsedJson.length === 0) {
                errorMsg.innerText = "Error: आपके डेटा में कोई सही प्रश्न नहीं मिला (विकल्प खाली हैं)।";
                errorMsg.classList.remove('hidden');
                return;
            }

        window.addEventListener('resize', () => { requestAnimationFrame(adjustFontSize); });

        function initQuiz() { 
            if(questions.length === 0) {
                document.getElementById('question-text').innerText = "कोई प्रश्न नहीं मिला। कृपया JSON चेक करें।";
                return;
            }
            renderQuestion(); renderPalette(); startTime(); 
        }

        function renderQuestion() {
            if(questions.length === 0) return;
            const q = questions[currentIndex];
            
            const qContainer = document.getElementById('q-text-container');
            qContainer.style.opacity = '0';

            document.getElementById('question-number').innerText = 'प्रश्न ' + (currentIndex + 1) + ' / ' + questions.length;
            document.getElementById('question-text').innerText = q.q;
            
            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('div');
                let extraClasses = 'bg-white border-gray-100';
                let icon = '';
                if (userAnswers[q.id] !== undefined) {
                    if (index === q.correct) { extraClasses = 'option-correct'; }
                    if (userAnswers[q.id] === index && index !== q.correct) { extraClasses = 'option-wrong'; }
                    if (userAnswers[q.id] === index) { icon = index === q.correct ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>'; }
                }
                btn.className = 'option-card p-2.5 rounded-xl border-2 flex justify-between items-center mb-2 ' + extraClasses;
                
                btn.innerHTML = '<span class="font-medium option-text" style="font-size:15px;">' + (index + 1) + '. ' + opt + '</span>' + icon;
                
                btn.onclick = () => selectOption(index);
                optionsList.appendChild(btn);
            });

            document.querySelectorAll('.palette-btn').forEach(btn => btn.classList.remove('palette-current'));
            const currentBtn = document.querySelector('[data-idx="' + currentIndex + '"]');
            if (currentBtn) currentBtn.classList.add('palette-current');

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;
            
            setTimeout(() => {
                adjustFontSize();
                qContainer.style.opacity = '1';
            }, 10);
        }

        function adjustFontSize() {
            const qContainer = document.getElementById('q-text-container');
            const qText = document.getElementById('question-text');
            
            let qSize = 20; 
            qText.style.fontSize = qSize + 'px';
            
            let sh = qText.scrollHeight;
            let ch = qContainer.clientHeight;
            
            while (sh > ch && qSize > 12) {
                qSize -= 1;
                qText.style.fontSize = qSize + 'px';
                sh = qText.scrollHeight; 
            }
        }

        function selectOption(idx) {
            const q = questions[currentIndex];
            if (userAnswers[q.id] !== undefined) return;
            userAnswers[q.id] = idx;
            renderQuestion(); renderPalette();
            setTimeout(() => { if (currentIndex < questions.length - 1) nextQuestion(); }, 600);
        }

        function renderPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                const isAnswered = userAnswers[q.id] !== undefined;
                btn.className = 'palette-btn ' + (isAnswered ? 'palette-answered' : 'bg-gray-200 text-gray-600') + ' hover:bg-blue-400 hover:text-white';
                btn.innerText = index + 1;
                btn.setAttribute('data-idx', index);
                btn.onclick = () => { currentIndex = index; renderQuestion(); };
                palette.appendChild(btn);
            });
        }

        function startTime() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                let s = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = m + ':' + s;
            }, 1000);
        }

        function nextQuestion() { if(currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
        function prevQuestion() { if(currentIndex > 0) { currentIndex--; renderQuestion(); } }
        
        function shuffleQuiz() { 
            questions.sort(() => Math.random() - 0.5); 
            currentIndex = 0; userAnswers = {}; 
            renderQuestion(); renderPalette(); 
        }

        function checkSubmission() {
            clearInterval(timerInterval);
            let correctCount = 0, wrongCount = 0, leftCount = 0;
            questions.forEach(q => {
                if(userAnswers[q.id] === undefined) leftCount++;
                else if(userAnswers[q.id] === q.correct) correctCount++;
                else wrongCount++;
            });
            const percent = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
            
            document.getElementById('result-score').innerText = 'आपका स्कोर: ' + percent + '%';
            document.getElementById('stat-correct').innerText = 'सही: ' + correctCount;
            document.getElementById('stat-wrong').innerText = 'गलत: ' + wrongCount;
            document.getElementById('stat-left').innerText = 'छूटे: ' + leftCount;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function retestWrongOnly() {
            const wrongOrLeft = allQuestionsData.filter(q => userAnswers[q.id] !== q.correct);
            if(wrongOrLeft.length === 0) { alert("सभी उत्तर सही हैं! कोई गलत प्रश्न नहीं बचा।"); return; }
            questions = wrongOrLeft;
            currentIndex = 0; userAnswers = {}; secondsElapsed = 0;
            document.getElementById('result-modal').classList.add('hidden');
            initQuiz();
        }

        function restartQuiz() {
            questions = [...allQuestionsData];
            currentIndex = 0; userAnswers = {}; secondsElapsed = 0;
            document.getElementById('result-modal').classList.add('hidden');
            initQuiz();
        }

            '<p class="font-bold text-gray-800 mb-2">' + (i+1) + '. ' + q.q + '</p>' +
            
            // नीचे दी गई लाइन में बदलाव किया गया है (स्क्रैच कार्ड इफ़ेक्ट के लिए)
            '<p class="font-semibold cursor-pointer bg-gray-300 text-transparent rounded-lg px-3 py-1.5 select-none transition-all duration-300 inline-block" ' + 
            'onclick="this.classList.remove(\'bg-gray-300\', \'text-transparent\'); this.classList.add(\'text-emerald-700\')" ' + 
            'title="उत्तर देखने के लिए क्लिक करें">' +

            '</p>' +
        '</div>';

}

        function renderFc() {
            if(questions.length === 0) return;

            document.getElementById('fc-number').innerText = 'प्रश्न ' + (fcIndex + 1) + ' / ' + questions.length;
