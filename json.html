<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Data to MCQ JSON</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #009688;
        }
        .info-text {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 14px;
            border: 2px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        button {
            flex: 1;
            padding: 12px;
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #00796b;
        }
        #downloadBtn {
            background-color: #2196F3;
            display: none;
        }
        #downloadBtn:hover {
            background-color: #0b7dda;
        }
        #copyBtn {
            background-color: #ff9800;
            display: none;
        }
        #copyBtn:hover {
            background-color: #e68a00;
        }
        .output-container {
            position: relative;
        }
        pre {
            background-color: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            min-height: 100px;
        }
        .stats {
            margin-bottom: 10px;
            font-weight: bold;
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <h2>Raw List to MCQ JSON Converter</h2>
    <p class="info-text">
        यहाँ अपना <b>Raw = [ ("Question", "Right Answer", ["Wrong1", "Wrong2", "Wrong3"]) ]</b> वाला डेटा पेस्ट करें। <br>
        यह टूल अपने आप ऑप्शंस को a,b,c,d में सेट करेगा और सही उत्तर को मिक्स कर देगा।
    </p>
    
    <div>
        <label for="inputText">यहाँ अपना टेक्स्ट पेस्ट करें:</label>
        <textarea id="inputText" placeholder="Raw = [ (&#34;IPL 2026 किसने जीता?&#34;,&#34;रॉयल चैलेंजर्स बेंगलुरु&#34;,[&#34;गुजरात टाइटन्स&#34;,&#34;चेन्नई सुपर किंग्स&#34;,&#34;कोलकाता नाइट राइडर्स&#34;]) ]"></textarea>
    </div>

    <div class="btn-group">
        <button onclick="convertToJSON()">Convert to JSON</button>
        <button id="copyBtn" onclick="copyJSON()">Copy JSON</button>
        <button id="downloadBtn" onclick="downloadJSON()">Download JSON File</button>
    </div>

    <div class="output-container">
        <div id="statsBox" class="stats"></div>
        <label for="outputText">JSON Output:</label>
        <pre id="outputText">यहाँ JSON आउटपुट दिखाई देगा...</pre>
    </div>

    <script>
        let finalJSONString = "";

        function convertToJSON() {
            const text = document.getElementById('inputText').value;
            const result = [];
            
            // Regex to extract ("Question", "Answer", ["Wrong1", "Wrong2"])
            // Supports both single (') and double (") quotes
            const tupleRegex = /\(\s*(["'])(.*?)\1\s*,\s*(["'])(.*?)\3\s*,\s*\[(.*?)\]\s*\)/g;
            let match;
            let idCounter = 1;

            while ((match = tupleRegex.exec(text)) !== null) {
                const questionText = match[2].trim();
                const correctAnswer = match[4].trim();
                const wrongOptionsStr = match[5];

                // Extract wrong options from the array string
                const wrongOptions = [];
                const optionRegex = /(["'])(.*?)\1/g;
                let optMatch;
                while ((optMatch = optionRegex.exec(wrongOptionsStr)) !== null) {
                    wrongOptions.push(optMatch[2].trim());
                }

                // Combine correct and wrong options
                const allOptions = [correctAnswer, ...wrongOptions];

                // Shuffle the options array so correct answer is at a random position
                for (let i = allOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allOptions[i], allOptions[j]] = [allOptions[j], allOptions[i]];
                }

                // Map to a, b, c, d...
                const optionKeys = ['a', 'b', 'c', 'd'];
                const optionsObj = {};
                let correctKey = '';

                allOptions.forEach((opt, index) => {
                    const key = optionKeys[index] || `opt${index}`;
                    optionsObj[key] = opt;
                    if (opt === correctAnswer) {
                        correctKey = key; // Save the key of the correct answer
                    }
                });

                result.push({
                    id: idCounter++,
                    question: questionText,
                    options: optionsObj,
                    answer: correctKey
                });
            }

            const outputElement = document.getElementById('outputText');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            const statsBox = document.getElementById('statsBox');

            if (result.length > 0) {
                finalJSONString = JSON.stringify(result, null, 4);
                outputElement.textContent = finalJSONString;
                downloadBtn.style.display = "block";
                copyBtn.style.display = "block";
                
                statsBox.innerHTML = `सफलतापूर्वक ${result.length} प्रश्न बनाए गए!`;
            } else {
                outputElement.textContent = "डेटा प्रोसेस नहीं हो सका। कृपया चेक करें कि फॉर्मेट [ (\"प्र.\", \"उत्तर\", [\"ग1\", \"ग2\"]) ] जैसा हो।";
                downloadBtn.style.display = "none";
                copyBtn.style.display = "none";
                statsBox.innerHTML = "";
            }
        }

        function downloadJSON() {
            if (!finalJSONString) return;
            const blob = new Blob([finalJSONString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "mcq_parsed_data.json"; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyJSON() {
            if (!finalJSONString) return;
            navigator.clipboard.writeText(finalJSONString).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = "Copied!";
                copyBtn.style.backgroundColor = "#4CAF50";
                
                setTimeout(() => {
                    copyBtn.innerText = "Copy JSON";
                    copyBtn.style.backgroundColor = "#ff9800"; 
                }, 2000);
            }).catch(err => {
                alert("कॉपी करने में समस्या हुई: " + err);
            });
        }
    </script>
</body>
</html>
