<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} — One Liner Notes | My Study Portal</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
body{margin:0;background:#eef3f7;color:#172033;font-family:Arial,"Noto Sans Devanagari",sans-serif}
.wrap{width:min(1080px,92%);margin:auto}
header{background:linear-gradient(135deg,#0d426d,#176b9d);color:#fff}
.head{min-height:68px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:19px}.nav{display:flex;gap:6px}.nav a{color:#fff;text-decoration:none;padding:9px 11px;border-radius:8px;font-size:13px}
main{padding:18px 0 35px}.crumb{font-size:13px;color:#63758a;margin-bottom:15px}.crumb a{color:#2f6698}
.hero{background:linear-gradient(135deg,#fff,#edf7fc);border:1px solid #d4e2ec;border-radius:17px;padding:22px}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e3f1fb;color:#18527e;font-size:11px;font-weight:800}
h1{font-size:32px;margin:10px 0 5px}.desc{color:#64748b;margin:0}
.ad{height:80px;background:#fff;border:1px solid #d8e1e8;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:11px;margin:18px 0}
.toolbar{background:#fff;border:1px solid #d6e1e9;border-radius:13px;padding:12px;margin-bottom:12px}
.rows{border:1px solid #d6e1e9;border-radius:13px;overflow:hidden}
.question-row{display:grid;grid-template-columns:1.45fr 1fr;min-height:58px;border-bottom:1px solid #d9e2e9}
.question-row:last-child{border-bottom:0}.question-row:nth-child(odd){background:#fff}.question-row:nth-child(even){background:#f3f8fb}
.question,.answer{padding:13px 15px;display:flex;gap:10px;align-items:center}.q-num{font-weight:800;color:#2e6795;min-width:28px}.answer{font-weight:700;color:#173b5f;border-left:1px solid #d9e2e9}
footer{background:linear-gradient(145deg,#102f4d,#16486d);color:#dbeafe;padding:26px 0}
@media(max-width:700px){.head{align-items:flex-start;flex-direction:column;padding:12px 0;gap:8px}.nav{overflow:auto;width:100%}.hero{padding:18px}h1{font-size:27px}.question-row{grid-template-columns:1fr}.answer{border-left:0;border-top:1px dashed #d4e0e8;padding-left:53px}.ad{height:70px}}
</style>
</head>
<body>
<header><div class="wrap head"><div class="brand">📚 My Study Portal</div><nav class="nav"><a href="../../../../../index.html">Home</a><a href="../../../../../index.html">Notes</a><a href="../../../../../test-series/index.html">Test Series</a></nav></div></header>
<main class="wrap">
<div class="crumb"><a href="../../../../../index.html">Home</a> › Subject Wise Notes › Topic</div>
<section class="hero"><span class="tag">One Liner Revision Notes</span><h1>{{TITLE}}</h1><p class="desc">{{DESCRIPTION}}</p></section>
<div class="ad">Advertisement</div>
<div class="toolbar"><b>{{QUESTION_COUNT}} Questions</b> · Direct Reading / Practice Mode template hook</div>
<section class="rows">{{QUESTIONS_HTML}}</section>
</main>
<footer><div class="wrap"><b>My Study Portal</b><p>One Liner Revision Notes</p></div></footer>
</body>
</html>
