<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap'); * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; } body { background: #f0f2f5; color: #1e293b; } .header { background: #1d4ed8; color: #fff; padding: 15px 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); position: sticky; top: 0; z-index: 50; } .head { max-width: 900px; margin: auto; display: flex; justify-content: space-between; align-items: center; } .logo { font-size: 22px; font-weight: 800; color: #fde047; text-decoration: none; letter-spacing: 0.5px; } .exam-tag { background: rgba(255, 255, 255, 0.2); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; } .wrap { max-width: 900px; margin: 20px auto; padding: 0 15px; } .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); } .ad-slot { margin: 20px 0; background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px; min-height: 100px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 13px; font-weight: 500; text-align: center; padding: 10px; overflow: hidden; } .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; } .test-title { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 5px; } .meta-info { font-size: 13px; color: #64748b; font-weight: 500; } .timer { background: #eff6ff; border: 2px solid #bfdbfe; border-radius: 10px; padding: 10px 18px; font-size: 18px; font-weight: 800; color: #1d4ed8; } .timer.danger { background: #fef2f2; border-color: #fecaca; color: #dc2626; animation: pulse 1s infinite; } @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } } .progress-container { width: 100%; height: 8px; background: #e2e8f0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; } .progress-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb); width: 0%; transition: width 0.3s ease; } .qnum { display: inline-block; background: #e0e7ff; color: #4338ca; font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 8px; margin-bottom: 15px; } .question { font-size: 18px; font-weight: 600; line-height: 1.6; margin-bottom: 20px; color: #1e293b; white-space: pre-wrap; } .opt { display: flex; align-items: center; width: 100%; text-align: left; background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px 15px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-size: 15px; font-weight: 500; color: #334155; } .opt:hover { border-color: #94a3b8; background: #f8fafc; transform: translateY(-1px); } .opt.sel { border-color: #2563eb; background: #eff6ff; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.1); } .letter { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: #e2e8f0; margin-right: 15px; font-weight: 700; color: #475569; flex-shrink: 0; } .opt.sel .letter { background: #2563eb; color: #fff; } .nav-buttons { display: flex; justify-content: space-between; margin-top: 25px; gap: 15px; } .btn { flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: center; } .btn:disabled { opacity: 0.5; cursor: not-allowed; } .btn-prev { background: #f1f5f9; color: #475569; } .btn-prev:hover:not(:disabled) { background: #e2e8f0; } .btn-next { background: #3b82f6; color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); } .btn-next:hover { background: #2563eb; } .btn-submit { background: #16a34a; color: #fff; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3); } .btn-submit:hover { background: #15803d; } .palette { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; } .dot { width: 42px; height: 42px; border: 2px solid #e2e8f0; background: #fff; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: #64748b; transition: 0.2s; } .dot:hover { border-color: #94a3b8; } .dot.done { background: #dcfce7; border-color: #86efac; color: #166534; } .dot.active { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; } .hidden { display: none !important; } .score-board { text-align: center; padding: 30px 10px; } .score-val { font-size: 55px; font-weight: 900; color: #1d4ed8; line-height: 1; margin-bottom: 10px; } .score-pct { font-size: 18px; font-weight: 700; color: #64748b; margin-bottom: 30px; } .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; } .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center; } .stat-box strong { display: block; font-size: 24px; font-weight: 800; color: #0f172a; } .stat-box span { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; } .review-card { border: 1px solid #e2e8f0; border-left: 6px solid #94a3b8; border-radius: 12px; padding: 20px; margin-bottom: 15px; background: #fff; } .review-card.correct { border-left-color: #22c55e; background: #f0fdf4; } .review-card.wrong { border-left-color: #ef4444; background: #fef2f2; } .rev-q { font-size: 16px; font-weight: 600; margin: 10px 0; color: #1e293b; white-space: pre-wrap; } .rev-ans { font-size: 14px; margin-bottom: 5px; font-weight: 500; } .exp-box { background: rgba(255,255,255,0.7); border: 1px dashed #cbd5e1; padding: 15px; border-radius: 10px; margin-top: 15px; font-size: 14px; color: #334155; white-space: pre-wrap; } .settings-box { max-width: 600px; margin: 40px auto; text-align: center; } .start-btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 25px; box-shadow: 0 4px 15px rgba(37,99,235,0.3); transition: 0.2s; } .start-btn:hover { background: #1d4ed8; } .set-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; text-align: left; } .set-inputs label { font-size: 12px; font-weight: 700; color: #64748b; } .set-inputs input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; font-weight: 600; outline: none; } @media(max-width: 650px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .set-inputs { grid-template-columns: 1fr; } .top-bar { flex-direction: column; gap: 15px; align-items: flex-start; } .timer { width: 100%; text-align: center; } }</style>

<body>

<header class="header">
    <div class="head">
        <a class="logo" href="../index.html"><i class="fas fa-graduation-cap"></i> Quiz Study</a>
        <div class="exam-tag">rrb</div>
    </div>
</header>

<main class="wrap">

    <!-- AD SLOT 1: Header ke theek neeche -->
    <div class="ad-slot">
        <!-- Add AdSense Display Ad Code Here -->
        [ AdSense Header Ad Slot ]
    </div>

    <section id="settings" class="card settings-box ">
        <h1 style="font-size:28px; color:#1e293b; font-weight:800; margin-bottom:10px;">Test Settings</h1>
        <p style="color:#64748b; font-size:14px; margin-bottom:20px;">Apni tayari ke hisaab se practice settings adjust karein.</p>
        
        <div class="set-inputs">
            <label>Time (Min)<input id="setDur" type="number" min="1" value="60"></label>
            <label>Correct (+)<input id="setPos" type="number" min="0" step="0.01" value="1"></label>
            <label>Negative (-)<input id="setNeg" type="number" min="0" step="0.01" value="0.25"></label>
        </div>
        
        <button class="start-btn" onclick="startTest()"><i class="fas fa-play mr-2"></i> Start Test Now</button>
    </section>

    <section id="test" class="hidden">
        <div class="top-bar">
            <div>
                <h1 class="test-title">rrb</h1>
                <div class="meta-info"><i class="fas fa-list"></i> 5 Questions</div>
            </div>
            <div id="timer" class="timer"><i class="fas fa-clock"></i> 00:00:00</div>
        </div>
        
        <div class="progress-container"><div id="progress" class="progress-bar"></div></div>
        
        <div id="questionBox" class="card"></div>

        <!-- AD SLOT 2: Question Nav ke upar -->
        <div class="ad-slot" style="min-height: 250px;">
             <!-- Add AdSense In-Article Ad Code Here -->
            [ AdSense In-Article Ad Slot ]
        </div>

        <div class="card">
            <h3 style="font-size:16px; margin-bottom:15px; color:#1e293b;"><i class="fas fa-th-large"></i> Question Palette</h3>

    <section id="result" class="hidden">
        <div class="card score-board">
            <div class="score-val" id="score"></div>
            <div class="score-pct" id="percentage"></div>
            
            <div class="stats-grid">
                <div class="stat-box"><strong id="st-cor" style="color:#16a34a">0</strong><span>Correct</span></div>
                <div class="stat-box"><strong id="st-wrg" style="color:#dc2626">0</strong><span>Wrong</span></div>
                <div class="stat-box"><strong id="st-una" style="color:#94a3b8">0</strong><span>Skipped</span></div>
                <div class="stat-box"><strong id="st-att" style="color:#2563eb">0</strong><span>Attempted</span></div>
            </div>
        </div>

        <!-- AD SLOT 3: Result Box ke theek neeche -->
        <div class="ad-slot">
             <!-- Add AdSense Multiplex or Display Ad Here -->
             [ AdSense Results Ad Slot ]
        </div>

        <div class="card">
            <h2 style="font-size:20px; font-weight:800; margin-bottom:20px;"><i class="fas fa-clipboard-check"></i> Answer Key & Solutions</h2>
            <div id="reviews"></div>
        </div>
    </section>

</main>
<script>const Q = [{"id":1,"q":"भारत की राजधानी क्या है?","options":["मुंबई","नई दिल्ली","कोलकाता","चेन्नई"],"answer":1,"explanation":"भारत की राजधानी नई दिल्ली है। 1911 में इसे कलकत्ता (अब कोलकाता) से स्थानांतरित करने की घोषणा की गई थी।"},{"id":2,"q":"सूर्य के सबसे निकट का ग्रह कौन सा है?","options":["पृथ्वी","मंगल","बुध","शुक्र"],"answer":2,"explanation":"बुध (Mercury) सूर्य के सबसे निकट का ग्रह है और यह हमारे सौरमंडल का सबसे छोटा ग्रह भी है।"},{"id":3,"q":"भारत का राष्ट्रीय पक्षी कौन सा है?","options":["कबूतर","मोर","तोता","कौआ"],"answer":1,"explanation":"मोर (Peacock) भारत का राष्ट्रीय पक्षी है। इसकी सुंदरता के कारण इसे 1963 में राष्ट्रीय पक्षी घोषित किया गया था।"},{"id":4,"q":"पानी का रासायनिक सूत्र (Chemical formula) क्या है?","options":["CO2","O2","H2O","NaCl"],"answer":2,"explanation":"पानी का रासायनिक सूत्र H2O है, जिसका अर्थ है कि इसमें हाइड्रोजन के दो और ऑक्सीजन का एक परमाणु होता है।"},{"id":5,"q":"कंप्यूटर का मस्तिष्क (Brain of Computer) किसे कहा जाता है?","options":["माउस","कीबोर्ड","मॉनिटर","CPU"],"answer":3,"explanation":"CPU (सेंट्रल प्रोसेसिंग यूनिट) को कंप्यूटर का मस्तिष्क कहा जाता है क्योंकि यह कंप्यूटर के सभी मुख्य निर्देशों और कार्यों को प्रोसेस करता है।"}];
const DEFAULT_DURATION = 3600;
const DEFAULT_POSITIVE = 1;
const DEFAULT_NEGATIVE = 0.25;
const ALLOW_CUSTOM = true;

let duration = DEFAULT_DURATION, positive = DEFAULT_POSITIVE, negative = DEFAULT_NEGATIVE;
let current = 0, answers = Array(Q.length).fill(null), left = 0, submitted = false, timerHandle = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");

function startTest() {
    if(ALLOW_CUSTOM) {
        duration = Math.max(1, Number($("setDur").value || DEFAULT_DURATION/60)) * 60;
        positive = Math.max(0, Number($("setPos").value ?? DEFAULT_POSITIVE));
        negative = Math.max(0, Number($("setNeg").value ?? DEFAULT_NEGATIVE));
    }
    $("settings").classList.add("hidden"); $("test").classList.remove("hidden");
    left = duration; renderQuestion(); tick(); timerHandle = setInterval(tick, 1000);
}

function renderQuestion() {
    const q = Q[current], selected = answers[current];
    $("questionBox").innerHTML = 
        '<div class="qnum">Question ' + (current+1) + ' of ' + Q.length + '</div>' +
        '<div class="question">' + esc(q.q) + '</div>' +
        q.options.map((opt, i) => 
            '<div class="opt ' + (selected === i ? 'sel' : '') + '" onclick="selectOpt(' + i + ')">' +
            '<div class="letter">' + String.fromCharCode(65+i) + '</div><div>' + esc(opt) + '</div></div>'
        ).join("") +
        '<div class="nav-buttons">' +
        '<button class="btn btn-prev" onclick="goTo(' + (current-1) + ')" ' + (current === 0 ? 'disabled' : '') + '><i class="fas fa-arrow-left"></i> Previous</button>' +
        (current === Q.length-1 ? 
            '<button class="btn btn-submit" onclick="submitTest(false)">Submit <i class="fas fa-check"></i></button>' : 
            '<button class="btn btn-next" onclick="goTo(' + (current+1) + ')">Next <i class="fas fa-arrow-right"></i></button>') +
        '</div>';
    
    $("progress").style.width = ((current+1)/Q.length*100) + '%';
    renderNav();
}

function renderNav() {
    $("navigation").innerHTML = Q.map((_, i) => 
        '<button class="dot ' + (answers[i] !== null ? 'done ' : '') + (i === current ? 'active' : '') + '" onclick="goTo(' + i + ')">' + (i+1) + '</button>'
    ).join("");
}

function selectOpt(i) { answers[current] = i; renderQuestion(); }
function goTo(i) { if(i >= 0 && i < Q.length) { current = i; renderQuestion(); window.scrollTo({top: 0, behavior: 'smooth'}); } }

function tick() {
    const h = Math.floor(left/3600), m = Math.floor((left%3600)/60), s = left%60;
    $("timer").textContent = [h, m, s].map(x => String(x).padStart(2, "0")).join(":");
    if(left <= 60) $("timer").classList.add("danger");
    if(left <= 0) { clearInterval(timerHandle); submitTest(true); }
    left--;
}

function fmt(x) { return Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0+$/, "").replace(/\.$/, ""); }

function submitTest(auto) {
    if(submitted) return;
    const unattempted = answers.filter(x => x === null).length;
    if(!auto && unattempted && !confirm(unattempted + " questions unanswered hain. Kya aap sach mein submit karna chahte hain?")) return;
    
    submitted = true; clearInterval(timerHandle);
    let correct = 0, wrong = 0;
    
    Q.forEach((q, i) => { if(answers[i] !== null) { answers[i] === q.answer ? correct++ : wrong++; } });
    const score = correct * positive - wrong * negative;
    
    $("test").classList.add("hidden"); $("result").classList.remove("hidden");
    $("score").textContent = fmt(score) + " / " + fmt(Q.length * positive);
    $("percentage").textContent = "Accuracy: " + fmt(score/(Q.length * positive)*100) + "%";
    
    $("st-cor").textContent = correct; $("st-wrg").textContent = wrong;
    $("st-una").textContent = unattempted; $("st-att").textContent = correct + wrong;
    
    showReview("all"); window.scrollTo({top: 0, behavior: 'smooth'});
}

function showReview(filter) {
    const list = Q.map((q, i) => ({ q, i, state: answers[i] === null ? "unattempted" : answers[i] === q.answer ? "correct" : "wrong" }))
                  .filter(x => filter === "all" || x.state === filter);
    
    $("reviews").innerHTML = list.map(x => 
        '<div class="review-card ' + x.state + '">' +
        '<span class="qnum">Q ' + (x.i+1) + '</span>' +
        '<div class="rev-q">' + esc(x.q.q) + '</div>' +
        '<div class="rev-ans" style="color:#64748b"><b>Aapka Jawab:</b> ' + (answers[x.i] === null ? "Skipped" : esc(x.q.options[answers[x.i]])) + '</div>' +
        '<div class="rev-ans" style="color:#16a34a"><b>Sahi Jawab:</b> ' + esc(x.q.options[x.q.answer]) + '</div>' +
        (x.q.explanation ? '<div class="exp-box"><b><i class="fas fa-lightbulb"></i> Explanation:</b><br>' + esc(x.q.explanation) + '</div>' : '') +
        '</div>'
    ).join("") || "<p style='text-align:center; padding:20px;'>Koi data nahi mila.</p>";
}

if(!ALLOW_CUSTOM) startTest();</script>
</body>
</html>
