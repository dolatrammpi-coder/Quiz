<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRB TEST 01 | Quiz Study</title>
<meta name="description" content="RRB TEST 01 — RRB Group D online test series.">
<meta name="robots" content="index,follow">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,"Noto Sans Devanagari",sans-serif}
.header{background:#fff;border-bottom:1px solid #e5e7eb}
.head{width:min(900px,94%);min-height:64px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:800;color:#173b7a}.exam{font-size:13px;color:#64748b;font-weight:700}
.wrap{width:min(900px,94%);margin:auto}.top{padding:22px 0 10px}
.line{display:flex;justify-content:space-between;gap:12px;align-items:center}
.meta{color:#64748b;font-size:14px;line-height:1.6}
.timer{background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:10px 15px;font-weight:900;color:#173b7a}
.timer.danger{color:#b91c1c;background:#fff5f5}
.bar{height:7px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:#1769d2}
.card{background:#fff;border:1px solid #e5e9ef;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 18px rgba(15,23,42,.055)}
.qnum{color:#1769d2;font-weight:900;font-size:13px}
.question{font-size:19px;font-weight:750;line-height:1.65;margin:10px 0 17px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:13px;margin:9px 0;cursor:pointer;line-height:1.5}
.opt.sel{border-color:#1769d2;background:#edf5ff}
.letter{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#eef2f7;align-items:center;justify-content:center;margin-right:8px;font-weight:800}
.sel .letter{background:#1769d2;color:#fff}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:800;cursor:pointer}
.prev{background:#eef2f7}.next{background:#1769d2;color:#fff}.submit{background:#15803d;color:#fff}
.nav{display:flex;flex-wrap:wrap;gap:7px}.dot{width:36px;height:36px;border:1px solid #dbe3ee;background:#fff;border-radius:9px;cursor:pointer}
.dot.done{background:#eaf7ee;color:#166534}.dot.active{outline:2px solid #1769d2}
.hidden{display:none!important}.settings{max-width:620px;margin:30px auto}
.setting-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.setting-grid label{display:block;font-size:12px;font-weight:800;color:#475569}
.setting-grid input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin-top:5px;font:inherit}
.start{width:100%;margin-top:15px;background:#1769d2;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:900}
.score{text-align:center;font-size:42px;font-weight:900;color:#173b7a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{text-align:center;background:#f8fafc;border:1px solid #e5e7eb;border-radius:11px;padding:12px}
.stat strong{display:block;font-size:21px}.stat span{font-size:12px;color:#64748b}
.filter{background:#fff;border:1px solid #dbe3ee;border-radius:10px;padding:9px 13px;font-weight:800}
.filter.active{background:#1769d2;color:#fff}
.review{border:1px solid #e5e7eb;border-left:5px solid #64748b;border-radius:13px;padding:15px;margin:10px 0}
.review.correct{border-left-color:#16a34a}.review.wrong{border-left-color:#dc2626}
.reviewq{font-weight:800;line-height:1.6}.ans{font-size:14px;margin-top:7px;line-height:1.6}
.exp{background:#f8fafc;padding:11px;border-radius:9px;margin-top:9px;line-height:1.7;color:#475569}
@media(max-width:650px){.head{justify-content:center}.exam{display:none}.setting-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="header">
<div class="head">
<a class="logo" href="../index.html">Quiz Study</a>
<div class="exam">RRB Group D</div>
</div>
</header>

<main class="wrap">

<section id="settings" class="card settings ">
<h1>Test Settings</h1>
<p class="meta">Test शुरू करने से पहले अपनी practice settings चुनें।</p>
<div class="setting-grid">
<label>Time (minutes)<input id="settingDuration" type="number" min="1" value="5"></label>
<label>Correct Marks<input id="settingPositive" type="number" min="0" step="0.01" value="1"></label>
<label>Negative Marking<input id="settingNegative" type="number" min="0" step="0.01" value="0.33"></label>
</div>
<button class="start" onclick="startTest()">START TEST</button>
</section>

<section id="test" class="hidden">
<div class="top">
<div class="line">
<div><h1>RRB TEST 01</h1><div class="meta">RRB Group D • 5 Questions</div></div>
<div id="timer" class="timer">00:00:00</div>
</div>
<div class="bar"><i id="progress"></i></div>
</div>
<div class="card"><div class="meta"><b>Test Mode:</b> Submit से पहले सही answer या explanation नहीं दिखेगा।</div></div>
<div id="questionBox" class="card"></div>
<div class="card"><b>Question Navigation</b><div id="navigation" class="nav"></div></div>
</section>

<section id="result" class="hidden">
<div class="card">
<div class="score" id="score"></div>
<div class="meta" id="percentage" style="text-align:center"></div>
<div class="stats">
<div class="stat"><strong id="correct">0</strong><span>Correct</span></div>
<div class="stat"><strong id="wrong">0</strong><span>Wrong</span></div>
<div class="stat"><strong id="unattempted">0</strong><span>Unattempted</span></div>
<div class="stat"><strong id="attempted">0</strong><span>Attempted</span></div>
</div>
</div>
<div class="card">
<h2>📋 Question Review</h2>
<div>
<button class="filter active" data-filter="all">All Questions</button>
<button class="filter" data-filter="correct">Correct</button>
<button class="filter" data-filter="wrong">Wrong</button>
<button class="filter" data-filter="unattempted">Unattempted</button>
</div>
<div id="reviews"></div>
</div>
</section>

</main>
<script>
const Q=[{"id":1,"q":"भारत की राजधानी क्या है?","options":["मुंबई","नई दिल्ली","कोलकाता","चेन्नई"],"answer":1,"explanation":"भारत की राजधानी नई दिल्ली है। 1911 में इसे कलकत्ता (अब कोलकाता) से स्थानांतरित करने की घोषणा की गई थी।"},{"id":2,"q":"सूर्य के सबसे निकट का ग्रह कौन सा है?","options":["पृथ्वी","मंगल","बुध","शुक्र"],"answer":2,"explanation":"बुध (Mercury) सूर्य के सबसे निकट का ग्रह है और यह हमारे सौरमंडल का सबसे छोटा ग्रह भी है।"},{"id":3,"q":"भारत का राष्ट्रीय पक्षी कौन सा है?","options":["कबूतर","मोर","तोता","कौआ"],"answer":1,"explanation":"मोर (Peacock) भारत का राष्ट्रीय पक्षी है। इसकी सुंदरता के कारण इसे 1963 में राष्ट्रीय पक्षी घोषित किया गया था।"},{"id":4,"q":"पानी का रासायनिक सूत्र (Chemical formula) क्या है?","options":["CO2","O2","H2O","NaCl"],"answer":2,"explanation":"पानी का रासायनिक सूत्र H2O है, जिसका अर्थ है कि इसमें हाइड्रोजन के दो और ऑक्सीजन का एक परमाणु होता है।"},{"id":5,"q":"कंप्यूटर का मस्तिष्क (Brain of Computer) किसे कहा जाता है?","options":["माउस","कीबोर्ड","मॉनिटर","CPU"],"answer":3,"explanation":"CPU (सेंट्रल प्रोसेसिंग यूनिट) को कंप्यूटर का मस्तिष्क कहा जाता है क्योंकि यह कंप्यूटर के सभी मुख्य निर्देशों और कार्यों को प्रोसेस करता है।"}];
const DEFAULT_DURATION=300;
const DEFAULT_POSITIVE=1;
const DEFAULT_NEGATIVE=0.33;
const ALLOW_CUSTOM=true;

let duration=DEFAULT_DURATION;
let positive=DEFAULT_POSITIVE;
let negative=DEFAULT_NEGATIVE;
let current=0;
let answers=Array(Q.length).fill(null);
let left=0;
let submitted=false;
let timerHandle=null;

const $=id=>document.getElementById(id);

function esc(s){
 return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function startTest(){
 duration=Math.max(1,Number($("settingDuration").value||DEFAULT_DURATION/60))*60;
 positive=Math.max(0,Number($("settingPositive").value??DEFAULT_POSITIVE));
 negative=Math.max(0,Number($("settingNegative").value??DEFAULT_NEGATIVE));

 $("settings").classList.add("hidden");
 $("test").classList.remove("hidden");

 left=duration;
 renderQuestion();
 tick();
 timerHandle=setInterval(tick,1000);
}

function renderQuestion(){
 const q=Q[current];
 const selected=answers[current];

 $("questionBox").innerHTML=
  '<div class="qnum">Question '+(current+1)+' / '+Q.length+'</div>'+
  '<div class="question">'+esc(q.q)+'</div>'+
  q.options.map((option,index)=>
   '<button class="opt '+(selected===index?'sel':'')+'" onclick="selectOption('+index+')">'+
   '<span class="letter">'+String.fromCharCode(65+index)+'</span>'+esc(option)+
   '</button>'
  ).join("")+
  '<div class="row">'+
  '<button class="btn prev" onclick="goTo('+(current-1)+')" '+(current===0?'disabled':'')+'>← Previous</button>'+
  (current===Q.length-1
   ?'<button class="btn submit" onclick="submitTest(false)">Submit Test</button>'
   :'<button class="btn next" onclick="goTo('+(current+1)+')">Next →</button>')+
  '</div>';

 $("progress").style.width=((current+1)/Q.length*100)+'%';
 renderNavigation();
}

function renderNavigation(){
 $("navigation").innerHTML=
  Q.map((_,index)=>
   '<button class="dot '+(answers[index]!==null?'done ':'')+(index===current?'active':'')+'" onclick="goTo('+index+')">'+
   (index+1)+
   '</button>'
  ).join("");
}

function selectOption(index){ answers[current]=index; renderQuestion(); }
function goTo(index){
 if(index<0||index>=Q.length)return;
 current=index;
 const oldScroll=window.scrollY;
 renderQuestion();
 requestAnimationFrame(()=>{ window.scrollTo(0,oldScroll); });
}

function tick(){
 const h=Math.floor(left/3600);
 const m=Math.floor((left%3600)/60);
 const s=left%60;
 $("timer").textContent=[h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
 if(left<=60){ $("timer").classList.add("danger"); }
 if(left<=0){ clearInterval(timerHandle); submitTest(true); return; }
 left--;
}

function fmt(x){ return Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0+$/,"").replace(/\.$/,""); }

function submitTest(auto){
 if(submitted)return;
 const unattempted=answers.filter(x=>x===null).length;
 if(!auto&&unattempted&&!confirm(unattempted+" questions unanswered हैं। Submit करें?")){ return; }
 submitted=true;
 clearInterval(timerHandle);

 let correct=0;
 let wrong=0;

 Q.forEach((q,index)=>{
  if(answers[index]===null){ return; }
  if(answers[index]===q.answer){ correct++; }else{ wrong++; }
 });

 const score=correct*positive-wrong*negative;

 $("test").classList.add("hidden");
 $("result").classList.remove("hidden");
 $("score").textContent=fmt(score)+" / "+fmt(Q.length*positive);
 $("percentage").textContent="Percentage: "+fmt(score/(Q.length*positive)*100)+"%";
 $("correct").textContent=correct;
 $("wrong").textContent=wrong;
 $("unattempted").textContent=unattempted;
 $("attempted").textContent=correct+wrong;

 showReview("all");
 window.scrollTo(0,0);
}

function showReview(filter){
 const list=Q.map((q,index)=>{
   const state=answers[index]===null?"unattempted":answers[index]===q.answer?"correct":"wrong";
   return{q,index,state};
  }).filter(x=>filter==="all"||x.state===filter);

 $("reviews").innerHTML=list.map(x=>
   '<article class="review '+x.state+'">'+
   '<div class="qnum">Question '+(x.index+1)+' • '+x.state+'</div>'+
   '<div class="reviewq">'+esc(x.q.q)+'</div>'+
   '<div class="ans"><b>आपका उत्तर:</b> '+(answers[x.index]===null?"उत्तर नहीं दिया":esc(x.q.options[answers[x.index]]))+'</div>'+
   '<div class="ans"><b>सही उत्तर:</b> '+esc(x.q.options[x.q.answer])+'</div>'+
   '<div class="exp"><b>Explanation:</b><br>'+esc(x.q.explanation)+'</div>'+
   '</article>'
  ).join("")||"<p>इस category में कोई प्रश्न नहीं है।";
}

document.querySelectorAll(".filter").forEach(button=>{
 button.onclick=()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  button.classList.add("active");
  showReview(button.dataset.filter);
 };
});

if(!ALLOW_CUSTOM){ startTest(); }
</script>
</body>
</html>
