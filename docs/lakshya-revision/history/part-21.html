<style>
/* =========================================================
   THEME VARIABLES
   ========================================================= */
:root {
  --bg-body:#e8eef5;
  --bg-gradient: radial-gradient(circle at 8% 0%, rgba(62,126,190,.08), transparent 30%), linear-gradient(180deg, #edf3f8 0%, #f3f6fa 48%, #e9eff5 100%);
  --text-main:#172033; --text-muted:#64748b; --bg-card:#ffffff; --border-color:#cbd5e1;
  --brand-primary:#124b87; --brand-secondary:#eef6ff; --accent:#2d73b9;
  --highlight-bg:#fff7ed; --highlight-text:#c2410c; --row-odd:#fffdf8; --row-even:#e8f3fc;
  --search-hit-bg:#fde68a;
  --qa-question-bg:#cfe3f5; --qa-question-text:#123b63;
  --qa-answer-bg:#e8f5e9; --qa-answer-text:#166534; --qa-border:#86b89a;
  --table-title-1:#123b68; --table-title-2:#1b628f; --table-head-bg:#edf5fb; --table-head-text:#164e73;
  --table-head-border:#a9c9df; --table-row-border:#dbe5ec; --table-hover:#eef7fc; --table-accent:#2d73b9;
}
body.dark-mode {
  --bg-body:#0f172a; --bg-gradient:none; --text-main:#f1f5f9; --text-muted:#94a3b8; --bg-card:#1e293b;
  --border-color:#334155; --brand-primary:#38bdf8; --brand-secondary:#1e293b; --row-odd:#1e293b; --row-even:#0f172a;
  --search-hit-bg:#78350f;
  --qa-question-bg:#214b6d; --qa-question-text:#ffffff; --qa-answer-bg:#123524; --qa-answer-text:#86efac; --qa-border:#3f7655;
  --table-title-1:#082f49; --table-title-2:#0b4568; --table-head-bg:#172f40; --table-head-text:#9edcff;
  --table-head-border:#31566d; --table-row-border:#334454; --table-hover:#172f55; --table-accent:#38a5d8;
}
*{box-sizing:border-box;} html{scroll-behavior:smooth;}
body{margin:0; background:var(--bg-body); background-image:var(--bg-gradient); color:var(--text-main); font-family:Arial,sans-serif; line-height:1.55; transition:.3s;}
a{text-decoration:none;color:inherit;} button{font-family:inherit;} .container{width:min(1080px,92%);margin:auto;}

/* =========================================================
   HEADER
   ========================================================= */
.site-header{background:linear-gradient(135deg, #0b4f86, #1769a5); color:#fff; position:sticky; top:0; z-index:20; box-shadow:0 4px 18px rgba(8,48,82,.18);}
.header-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;position:relative}
.brand{font-size:20px; font-weight:800; white-space:nowrap;} .top-nav{display:flex; gap:6px;}
.top-nav a{padding:9px 12px; border-radius:8px; font-size:14px; font-weight:700;} .top-nav a:hover, .top-nav .active{background:rgba(255,255,255,.12);}
.theme-toggle{background:transparent; border:0; color:#fff; cursor:pointer;} .theme-toggle svg{width:24px; height:24px; fill:currentColor;}

/* =========================================================
   BREADCRUMB / QUICK JUMP
   ========================================================= */
.breadcrumb{display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:18px 0 0; color:var(--text-muted); font-size:13px;}
.breadcrumb a{color:var(--accent); font-weight:600;}
.quick-jump{display:flex; gap:10px; overflow-x:auto; padding:14px 0 6px; scrollbar-width:none;}
.quick-jump::-webkit-scrollbar{display:none;}
.quick-jump a{white-space:nowrap; background:var(--bg-card); border:1px solid var(--border-color); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700; box-shadow:0 2px 5px rgba(0,0,0,.05);}

/* =========================================================
   HERO & CONTROLS
   ========================================================= */
.hero{margin-top:10px; padding:24px 22px; border:1px solid var(--border-color); border-radius:18px; background:var(--bg-card); box-shadow:0 7px 24px rgba(0,0,0,.04);}
.hero h1{margin:0 0 7px; font-size:clamp(27px,5vw,39px); line-height:1.25;}
.topic-kicker{display:inline-flex; align-items:center; gap:7px; color:#164f80; font-size:13px; font-weight:800; background:#e4f1fc; border:1px solid #c8dff1; padding:6px 10px; border-radius:999px; margin-bottom:10px;}
.topic-subtitle{margin:0; color:var(--text-muted); font-size:15px;}
.controls-wrap{display:flex; flex-wrap:wrap; gap:15px; align-items:center; margin:17px 0 11px;}
.mode-switch{display:grid; grid-template-columns:1fr 1fr; background:var(--border-color); padding:4px; border-radius:12px; width:100%; max-width:300px;}
.mode-switch button{border:0; background:transparent; color:var(--text-main); border-radius:9px; padding:9px 12px; font-size:14px; font-weight:700; cursor:pointer;}
.mode-switch button.active{background:var(--brand-primary); color:#fff;}
.filter-btn{display:flex; align-items:center; gap:6px; background:var(--bg-card); border:1px solid var(--border-color); padding:9px 15px; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer;}
.filter-btn.active{background:#fef08a; color:#854d0e; border-color:#fde047;}

/* =========================================================
   SEARCH
   ========================================================= */
.notes-search-wrap{width:100%; max-width:1100px; margin:18px auto 22px;}
.notes-search-box{display:flex; align-items:center; gap:10px; width:100%; background:var(--bg-card); border:1.5px solid var(--border-color); border-radius:14px; padding:10px 12px; box-shadow:0 3px 12px rgba(15,23,42,.06);}
.notes-search-icon{flex:0 0 auto; font-size:20px;}
#notesSearchInput{flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text-main); font-size:16px; font-weight:600; padding:7px 2px;}
#notesSearchInput::placeholder{color:#7b8794; font-weight:500;}
#notesSearchClear{display:none; flex:0 0 auto; border:0; background:#eef2f7; color:#475569; width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px; font-weight:800;}
.notes-search-status{min-height:20px; margin:7px 4px 0; font-size:13px; font-weight:700; color:var(--text-muted);}
.notes-search-wrap.search-active .notes-search-box{border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.10);}

/* =========================================================
   SECTION HEADERS (Q&A + Table)
   ========================================================= */
#dynamic-content-area { counter-reset: study-section; }

.qa-header,
.table-section > .table-title {
  counter-increment: study-section;
  position: relative;
  margin: 48px 0 18px;
  padding: 54px 24px 20px;
  color: #fff;
  background: linear-gradient(135deg, #063b66 0%, #075985 55%, #0877a8 100%);
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(3,55,90,.18);
  border-top: 4px solid #62c8ed;
}
.qa-header h2,
.table-section > .table-title .table-title-main {
  margin: 0;
  font-size: 1.22rem;
  line-height: 1.55;
  font-weight: 800;
  color: #fff;
}
.qa-header::before,
.table-section > .table-title::before {
  content: counter(study-section, decimal-leading-zero);
  position: absolute;
  left: 18px;
  top: 12px;
  width: 40px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 7px;
  color: #fff;
  background: rgba(255,255,255,.10);
  font-size: .82rem;
  font-weight: 900;
}
.qa-header::after,
.table-section > .table-title::after {
  content: "अध्ययन खंड";
  position: absolute;
  left: 70px;
  top: 19px;
  color: rgba(255,255,255,.82);
  font-size: .70rem;
  font-weight: 800;
  letter-spacing: .5px;
}
.table-section > .table-title .table-title-kicker {
  color: #9fd8f5;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.table-section > .table-title .table-title-sub {
  margin-top: 5px;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,.72);
}
.table-section > .table-title .table-shuffle-control {
  position: absolute;
  top: 12px;
  right: 14px;
}

/* =========================================================
   Q&A STRUCTURE (builder DOM)
   ========================================================= */
.qa-section { margin: 0 0 18px; }

/* Compact study heading: show one Q&A section heading per page */
#dynamic-content-area > .qa-section ~ .qa-section > .qa-header {
  display: none !important;
}

.qa-list { display: flex; flex-direction: column; gap: 12px; }

.qa-row {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(230px,32%);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 4px 14px rgba(0,0,0,.04);
  background: var(--bg-card);
}
.qa-row:nth-child(odd) { background: var(--row-odd); }
.qa-row:nth-child(even){ background: var(--row-even); }

.qa-q {
  position: relative;
  padding: 16px 48px 16px 18px;
  font-weight: 700;
  font-size: 16px;
  background: var(--qa-question-bg);
  color: var(--qa-question-text);
  border-right: 1px solid var(--qa-border);
}
.qa-q > span { display: inline; }

.star-btn {
  position: absolute;
  top: 12px; right: 12px;
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 20px;
  line-height: 1;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: .2s;
}
.star-btn:hover { background: rgba(234,179,8,.12); }
.star-btn.starred, .qa-row.starred .star-btn { color: #eab308; }

.qa-a {
  padding: 16px 18px;
  background: var(--qa-answer-bg);
  color: var(--qa-answer-text);
  font-weight: 700;
  display: flex;
  align-items: center;
  border-left: 1px solid var(--qa-border);
}
.qa-a .answer-text {
  width: 100%;
  color: var(--qa-answer-text);
  text-align: center;
  font-size: 16px;
  font-weight: 700;
}
.qa-a .cover {
  display: none;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 42px;
  padding: 10px 12px;
  border: 1px dashed var(--border-color);
  border-radius: 8px;
  background: var(--brand-secondary);
  color: var(--text-main);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
/* Practice mode visibility for Q&A */
body.practice .qa-a .answer-text { display: none; }
body.practice .qa-a .cover { display: flex; }
body.practice .qa-a.revealed .answer-text { display: block; }
body.practice .qa-a.revealed .cover { display: none; }

/* Search hit + author highlight */
strong.highlight {
  background: var(--highlight-bg);
  color: var(--qa-answer-text) !important;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 800;
}
mark.search-hit {
  background: var(--search-hit-bg);
  color: var(--qa-answer-text) !important;
  padding: 2px 4px;
  border-radius: 4px;
  font-weight: 800;
}

/* =========================================================
   TABLE STRUCTURE (builder DOM)
   ========================================================= */
.table-section { margin: 0 0 24px; }

.table-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 28px rgba(15,45,75,.08);
  position: relative;
}
.table-container { overflow-x: auto; }
.notes-table { width: 100%; min-width: 700px; border-collapse: collapse; text-align: left; }
.notes-table thead th {
  padding: 14px 20px;
  background: var(--table-head-bg);
  color: var(--table-head-text);
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  border-bottom: 2px solid var(--table-head-border);
  border-right: 1px solid var(--table-head-border);
  position: sticky;
  top: 0;
  z-index: 3;
}
.notes-table tbody tr { background: var(--bg-card); transition: .18s; }
.notes-table tbody tr:nth-child(even){ background: linear-gradient(90deg, var(--row-even), var(--bg-card)); }
.notes-table tbody tr:nth-child(odd) { background: linear-gradient(90deg, var(--bg-card), var(--row-odd)); }
.notes-table tbody tr:hover { background: var(--table-hover); }
.notes-table td {
  padding: 19px 20px;
  border-bottom: 1px solid var(--table-row-border);
  border-right: 1px solid var(--table-row-border);
  font-size: 14px;
  vertical-align: middle;
}
.primary-cell {
  font-size: 16px;
  font-weight: 800;
  color: var(--text-main);
  border-left: 4px solid var(--table-accent);
  padding-left: 15px;
}
.table-answer { position: relative; min-height: 28px; }
.table-answer .table-answer-text {
  color: var(--qa-answer-text) !important;
  font-weight: 700;
  font-size: 14px;
  line-height: 1.5;
}
.table-answer .table-cover {
  display: none;
  align-items: center;
  justify-content: center;
  min-height: 38px;
  padding: 6px 8px;
  border: 1px dashed var(--border-color);
  border-radius: 6px;
  background: var(--brand-secondary);
  color: var(--text-main);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
body.practice .table-answer .table-answer-text { visibility: hidden; }
body.practice .table-answer .table-cover { display: flex; }
body.practice .table-answer.revealed .table-answer-text { visibility: visible; }
body.practice .table-answer.revealed .table-cover { display: none; }

/* =========================================================
   SHUFFLE BUTTON
   ========================================================= */
.shuffle-control {
  display: flex; justify-content: flex-end; align-items: center;
  margin: 0 0 8px;
}
.shuffle-btn {
  background: var(--bg-card); color: var(--text-muted);
  border: 1px solid var(--border-color); border-radius: 9px;
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: .2s; font-size: 16px; flex-shrink: 0;
}
.shuffle-btn:hover { color: var(--brand-primary); border-color: var(--brand-primary); background: var(--brand-secondary); }
.shuffle-btn:active { transform: scale(.92); }

/* =========================================================
   NO RESULTS / FOOTER
   ========================================================= */
.no-results { display: none; padding: 30px; text-align: center; color: var(--text-muted); font-weight: 700; }

.site-footer { margin-top: 40px; background: linear-gradient(145deg, #102f4d, #16486d); color: #dbeafe; padding: 28px 0; }
.footer-inner { width: min(1080px, 92%); margin: auto; }
.footer-links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; margin-top: 15px; }
.footer-links a { color: #e2edf7; }

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:700px){
  .header-inner{flex-direction:column; align-items:flex-start; padding:12px 0;}
  .top-nav{overflow-x:auto;}
  .qa-row{display:block;}
  .qa-a{min-height:45px; border-left:0; border-top:1px solid var(--border-color); padding:12px;}
  .notes-table{min-width:0; width:100%; table-layout:fixed;}
  .notes-table th, .notes-table td{padding:10px 8px; font-size:13px; overflow-wrap:anywhere; word-break:break-word;}
  .qa-header, .table-section > .table-title { margin: 40px 0 16px; padding: 50px 16px 18px; border-radius: 14px; }
  .qa-header h2, .table-section > .table-title .table-title-main { font-size: 1.05rem; }
  .qa-header::before, .table-section > .table-title::before { left: 16px; top: 12px; }
  .qa-header::after, .table-section > .table-title::after { left: 65px; top: 19px; }
}

.qa-chapter-label{font-size:12px;font-weight:800;letter-spacing:.3px;color:#bfe8ff;margin-bottom:4px;}
</style>

(function(){
"use strict";

/* GENERIC JSON RENDERER: ordered content[] keeps one_liner/table interleaved.
   Expected item: {sequence, subject, chapter, section, page, type, content}.

function nEl(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined&&txt!==null)e.textContent=nText(txt);return e;}
function nPairs(item){
 const c=item&&item.content!==undefined?item.content:item;
 if(typeof c==="string"){
  const s=c.trim();
  const m=s.match(/^(.*?)\s+[—–]\s+(.*)$/s);
  return m?[{question:nText(m[1]),answer:nText(m[2])}]:[{question:nText(s),answer:""}];
 }
 if(Array.isArray(c))return c.flatMap(nPairs);
 if(c&&Array.isArray(c.questions))return c.questions.flatMap(nPairs);
 if(c&&typeof c==="object"){
  const q=c.question??c.q??c.question_text;
  const a=c.answer??c.a??c.answer_text??c.explanation;
  return q!==undefined||a!==undefined?[{question:nText(q),answer:nText(a)}]:[];
 }
 return [];
}

const STORAGE_KEY = "notes.starred.v1";
let practiceMode = false;
let starredOnly   = false;
let searchTerm    = "";
let searchDebounceTimer = null;

/* =========================================================
   STAR PERSISTENCE (localStorage)
   ========================================================= */
function loadStarred(){
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")); }
  catch(e){ return new Set(); }
}
function saveStarred(set){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e){}
}
let starredSet = loadStarred();

function rowKey(row){
  const q = row.querySelector(".qa-q");
  if(!q) return "";
  const clone = q.cloneNode(true);
  clone.querySelectorAll(".star-btn").forEach(b => b.remove());
  return clone.textContent.trim().slice(0, 160);
}

function restoreStars(){
  content.querySelectorAll(".qa-row").forEach(row => {
    const key = rowKey(row);
    const btn = row.querySelector(".star-btn");
    if(!btn || !key) return;
    if(starredSet.has(key)){
      btn.classList.add("starred");
      btn.textContent = "★";
      row.classList.add("starred");
      btn.setAttribute("aria-pressed","true");
    } else {
      btn.classList.remove("starred");
      btn.textContent = "☆";
      row.classList.remove("starred");
      btn.setAttribute("aria-pressed","false");
    }
  });
}

function toggleStar(btn){
  const row = btn.closest(".qa-row");
  if(!row) return;
  const key = rowKey(row);
  if(!key) return;
  const isStarred = !btn.classList.contains("starred");
  btn.classList.toggle("starred", isStarred);
  btn.textContent = isStarred ? "★" : "☆";
  btn.setAttribute("aria-pressed", String(isStarred));
  row.classList.toggle("starred", isStarred);
  if(isStarred) starredSet.add(key);
  else starredSet.delete(key);
  saveStarred(starredSet);
  if(starredOnly) applyCombinedFilters();
}

function setMode(practice){
  practiceMode = practice;
  document.body.classList.toggle("practice", practice);
  readingBtn.classList.toggle("active", !practice);
  practiceBtn.classList.toggle("active", practice);
  // reset reveal state on mode change
  content.querySelectorAll(".qa-a.revealed, .table-answer.revealed").forEach(el => el.classList.remove("revealed"));
}

readingBtn.addEventListener("click", () => setMode(false));
practiceBtn.addEventListener("click", () => setMode(true));

/* =========================================================
   SEARCH TEXT + HIGHLIGHT
   ========================================================= */
function getItemText(item){
  const clone = item.cloneNode(true);
  clone.querySelectorAll(".star-btn, .cover, .table-cover").forEach(el => el.remove());
  return clone.textContent.toLowerCase();
}

function clearHighlights(root){
  root.querySelectorAll("mark.search-hit").forEach(el => {
    const p = el.parentNode;
    if(!p) return;
    while(el.firstChild) p.insertBefore(el.firstChild, el);
    p.removeChild(el);
    p.normalize();
  });
}

function highlightMatches(root, term){
  clearHighlights(root);
  if(!term) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      const p = node.parentNode;
      if(!p) return NodeFilter.FILTER_REJECT;
      if(p.closest(".star-btn, .cover, .table-cover, mark.search-hit")) return NodeFilter.FILTER_REJECT;
      if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(node => {
    const text = node.nodeValue;
    const lower = text.toLowerCase();
    let idx = lower.indexOf(term);
    if(idx === -1) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    while(idx !== -1){
      if(idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
      const mark = document.createElement("mark");
      mark.className = "search-hit";
      mark.textContent = text.slice(idx, idx + term.length);
      frag.appendChild(mark);
      last = idx + term.length;
      idx = lower.indexOf(term, last);
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* =========================================================
   COMBINED FILTERS (Search + Starred)
   ========================================================= */
function applyCombinedFilters(){
  const term = searchTerm;
  let visibleCount = 0;

  /* Q&A rows */
  content.querySelectorAll(".qa-section").forEach(section => {
    let visibleRows = 0;
    section.querySelectorAll(".qa-row").forEach(row => {
      const matchesSearch = !term || getItemText(row).includes(term);
      const matchesStar = !starredOnly || row.classList.contains("starred");
      const visible = matchesSearch && matchesStar;
      row.style.display = visible ? "" : "none";
      if(visible){ visibleRows++; visibleCount++; }
    });
    section.style.display = visibleRows ? "" : "none";
    const header = section.previousElementSibling;
    if(header && header.classList.contains("qa-header")){
      header.style.display = visibleRows ? "" : "none";
    }
  });

  /* Table sections */
  content.querySelectorAll(".table-section").forEach(section => {
    if(starredOnly){
      section.style.display = "none";
      return;
    }
    const rows = section.querySelectorAll("tbody tr");
    let tableMatches = 0;
    if(rows.length){
      rows.forEach(tr => {
        const isMatch = !term || getItemText(tr).includes(term);
        tr.style.display = isMatch ? "" : "none";
        if(isMatch) tableMatches++;
      });
    } else {
      tableMatches = (!term || getItemText(section).includes(term)) ? 1 : 0;
    }
    if(term && tableMatches === 0 && getItemText(section).includes(term)){
      // title matched; show all rows
      rows.forEach(tr => tr.style.display = "");
      tableMatches = 1;
    }
    section.style.display = tableMatches ? "" : "none";
    if(tableMatches) visibleCount++;
  });

  /* Search UI feedback */
  searchWrap.classList.toggle("search-active", !!term);
  searchClear.style.display = term ? "block" : "none";
  if(!term) searchStatus.textContent = "";
  else if(visibleCount === 0) searchStatus.textContent = "कोई परिणाम नहीं मिला";
  else searchStatus.textContent = visibleCount + " परिणाम मिले";

  noResults.classList.toggle("visible", visibleCount === 0 && !!term);
}

/* =========================================================
   SHUFFLE
   ========================================================= */
function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleQaSection(section){
  const list = section.querySelector(".qa-list");
  if(!list) return;
  shuffleArray(Array.from(list.querySelectorAll(":scope > .qa-row"))).forEach(r => list.appendChild(r));
}

function shuffleTableSection(section){
  const tbody = section.querySelector("tbody");
  if(!tbody) return;
  shuffleArray(Array.from(tbody.querySelectorAll(":scope > tr"))).forEach(r => tbody.appendChild(r));
}

function shuffleAllQaRows(){
  const sections = Array.from(content.querySelectorAll(".qa-section"));
  const lists = sections.map(section => section.querySelector(".qa-list")).filter(Boolean);
  if(!lists.length) return;
  const capacities = lists.map(list => list.querySelectorAll(":scope > .qa-row").length);
  const rows = lists.flatMap(list => Array.from(list.querySelectorAll(":scope > .qa-row")));
  shuffleArray(rows);
  let offset = 0;
  lists.forEach((list, i) => {
    list.replaceChildren(...rows.slice(offset, offset + capacities[i]));
    offset += capacities[i];
  });
}
function shuffleAll(){
  shuffleAllQaRows();
  content.querySelectorAll(".table-section").forEach(shuffleTableSection);
  applyCombinedFilters();
}

shuffleBtn.addEventListener("click", shuffleAll);

/* =========================================================
   AUTO-INJECT SHUFFLE BUTTONS (per section)
   ========================================================= */
function injectShuffleControls(){
  // Exactly one shuffle control for all Q&A sections on this page.
  const qaSections = content.querySelectorAll(".qa-section");
  if(qaSections.length && !content.querySelector(":scope > .page-qa-shuffle")){
    const ctrl = document.createElement("div");
    ctrl.className = "shuffle-control page-qa-shuffle";
    ctrl.innerHTML = '<button class="shuffle-btn" type="button" aria-label="इस पेज के सभी प्रश्नों का क्रम बदलें" title="इस पेज के प्रश्न Shuffle">🔀</button>';
    content.insertBefore(ctrl, qaSections[0]);
  }
  // Keep a separate shuffle control for each table.
  content.querySelectorAll(".table-section").forEach(section => {
    const title = section.querySelector(":scope > .table-title");
    if(!title || title.querySelector(".table-shuffle-control")) return;
    const ctrl = document.createElement("div");
    ctrl.className = "table-shuffle-control";
    ctrl.innerHTML = '<button class="shuffle-btn" type="button" aria-label="तालिका क्रम बदलें" title="तालिका Shuffle">🔀</button>';
    title.appendChild(ctrl);
  });
}

/* =========================================================
   QUICK JUMP BUILDER
   ========================================================= */
function buildQuickJump(){
  if(!quickJump) return;
  quickJump.innerHTML = "";
  const sections = content.querySelectorAll(".qa-section, .table-section");
  sections.forEach((section, i) => {
    if(!section.id) section.id = "notes-section-" + (i + 1);
    const title =
      section.querySelector(".qa-header h2")?.textContent.trim() ||
      section.querySelector(".table-title-main")?.textContent.trim() ||
      ("Section " + (i + 1));
    const a = document.createElement("a");
    a.href = "#" + section.id;
    a.textContent = title;
    quickJump.appendChild(a);
  });
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
content.addEventListener("click", (e) => {
  // Shuffle button
  const shuffle = e.target.closest(".shuffle-btn");
  if(shuffle){
    const tb = shuffle.closest(".table-section");
    if(tb){
      shuffleTableSection(tb);
    } else if(shuffle.closest(".page-qa-shuffle")){
      shuffleAllQaRows();
      applyCombinedFilters();
    } else {
      const qa = shuffle.closest(".qa-section");
      if(qa) shuffleQaSection(qa);
    }
    if(searchTerm) highlightMatches(content, searchTerm);
    return;
  }
  // Star button
  const star = e.target.closest(".star-btn");
  if(star){ toggleStar(star); return; }
  // Q&A answer reveal (practice mode)
  if(practiceMode){
    const cover = e.target.closest(".qa-a .cover");
    if(cover){ cover.closest(".qa-a").classList.add("revealed"); return; }
    const tcover = e.target.closest(".table-answer .table-cover");
    if(tcover){ tcover.closest(".table-answer").classList.add("revealed"); return; }
  }
});

content.addEventListener("keydown", (e) => {
  if(e.key !== "Enter" && e.key !== " ") return;
  if(!practiceMode) return;
  const cover = e.target.closest(".qa-a .cover, .table-answer .table-cover");
  if(cover){
    e.preventDefault();
    cover.closest(".qa-a, .table-answer").classList.add("revealed");
  }
});

/* =========================================================
   SEARCH INPUT (debounced)
   ========================================================= */
searchInput.addEventListener("input", () => {
  const raw = (searchInput.value || "").trim().toLowerCase();
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    searchTerm = raw;
    if(!searchTerm && !starredOnly){
      clearHighlights(content);
      noResults.classList.remove("visible");
      content.querySelectorAll(".qa-row, .table-section, .qa-section, .qa-header").forEach(el => el.style.display = "");
      searchWrap.classList.remove("search-active");
      searchStatus.textContent = "";
      searchClear.style.display = "none";
    } else {
      applyCombinedFilters();
      if(searchTerm) highlightMatches(content, searchTerm);
      else clearHighlights(content);
    }
  }, 120);
});

searchClear.addEventListener("click", () => {
  searchInput.value = "";
  searchInput.dispatchEvent(new Event("input"));
  searchInput.focus();
});

/* =========================================================
   STARRED ONLY TOGGLE
   ========================================================= */
starredOnlyBtn.addEventListener("click", () => {
  starredOnly = !starredOnly;
  starredOnlyBtn.classList.toggle("active", starredOnly);
  if(searchTerm || starredOnly){
    applyCombinedFilters();
    if(searchTerm) highlightMatches(content, searchTerm);
  } else {
    clearHighlights(content);
    noResults.classList.remove("visible");
    content.querySelectorAll(".qa-row, .table-section, .qa-section, .qa-header").forEach(el => el.style.display = "");
    searchStatus.textContent = "";
  }
});

/* =========================================================
   MUTATION OBSERVER — handle injected content
   ========================================================= */
const observer = new MutationObserver(() => {
  restoreStars();
  buildQuickJump();
  injectShuffleControls();
});
observer.observe(content, { childList: true, subtree: false });

/* =========================================================
   INIT
   ========================================================= */
try { renderNotesData(NOTES_DATA); } catch(err) { console.error("Notes JSON render failed:",err); document.getElementById("dynamic-content-area").textContent="अध्याय सामग्री लोड नहीं हो सकी। JSON schema जाँचें।"; }
restoreStars();
buildQuickJump();
injectShuffleControls();
setMode(false);

})();
</script>

<script id="header-font-controls-script">
(function(){
  function initFontControls(){
    const header=document.querySelector('.header-inner');
    const content=document.querySelector('#dynamic-content-area');
    if(!header||!content||document.querySelector('.header-font-controls')) return;
    let scale=1;
    const controls=document.createElement('div');
    controls.className='header-font-controls';
    controls.setAttribute('role','group');
    controls.setAttribute('aria-label','पेज के अक्षरों का आकार');
    controls.innerHTML='<button type="button" class="font-smaller" aria-label="फ़ॉन्ट छोटा करें" title="फ़ॉन्ट छोटा करें">A−</button><span class="font-size-label" aria-live="polite">100%</span><button type="button" class="font-larger" aria-label="फ़ॉन्ट बड़ा करें" title="फ़ॉन्ट बड़ा करें">A+</button>';
    header.appendChild(controls);
    const label=controls.querySelector('.font-size-label');
    function apply(next){
      scale=Math.max(0.5,Math.min(1.5,Math.round(next*10)/10));
      content.querySelectorAll('*').forEach(function(el){
        if(!el.dataset.fontBaseSize){
          const size=parseFloat(getComputedStyle(el).fontSize);
          if(Number.isFinite(size)) el.dataset.fontBaseSize=String(size);
        }
        const base=parseFloat(el.dataset.fontBaseSize);
        if(Number.isFinite(base)) el.style.setProperty('font-size',(base*scale)+'px','important');
      });
      label.textContent=Math.round(scale*100)+'%';
      controls.querySelector('.font-smaller').disabled=scale<=0.5;
      controls.querySelector('.font-larger').disabled=scale>=1.5;
      controls.querySelectorAll('button').forEach(function(btn){btn.style.opacity=btn.disabled?'.45':'1';});
    }
    controls.querySelector('.font-smaller').addEventListener('click',function(){apply(scale-0.1);});
    controls.querySelector('.font-larger').addEventListener('click',function(){apply(scale+0.1);});
    apply(1);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initFontControls); else initFontControls();
})();
</script>
