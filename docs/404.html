<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<title>404 — Lost in Space | Lagale</title>
<meta name="description" content="This page drifted out of orbit. Return to Lagale to continue exploring.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --ink:#f8f7f2; --muted:#a8b1c2; --lime:#c7ff6b; --orange:#ff9e64; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; overflow-x:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 50% 55%,#172238 0%,#0b1020 48%,#060812 100%); display:grid; place-items:center; }
  .stars,.stars:before,.stars:after { position:fixed; inset:0; content:""; pointer-events:none; background-image:radial-gradient(2px 2px at 12% 22%,#fff 99%,transparent),radial-gradient(1px 1px at 72% 18%,#c7ff6b 99%,transparent),radial-gradient(1px 1px at 84% 68%,#fff 99%,transparent),radial-gradient(2px 2px at 28% 78%,#fff 99%,transparent),radial-gradient(1px 1px at 57% 88%,#ff9e64 99%,transparent),radial-gradient(1px 1px at 92% 36%,#fff 99%,transparent),radial-gradient(1px 1px at 41% 12%,#fff 99%,transparent); opacity:.7; animation:twinkle 4s ease-in-out infinite alternate; }
  .stars:before { transform:translate(30px,20px) scale(1.15); opacity:.45; }.stars:after { transform:translate(-20px,35px) scale(.8); opacity:.4; }
  .wrap { width:min(1000px,94vw); position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:clamp(20px,5vw,70px); padding:28px 0; }
  .copy { order:1; }.eyebrow { display:inline-flex; align-items:center; gap:9px; color:var(--lime); letter-spacing:.18em; text-transform:uppercase; font-size:.72rem; font-weight:800; }
  .dot { width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime); }
  h1 { font-size:clamp(4rem,10vw,8rem); line-height:.85; letter-spacing:-.09em; margin:22px 0 16px; } h1 span { color:var(--lime); }
  h2 { font-size:clamp(1.35rem,3vw,2.2rem); letter-spacing:-.04em; margin:0 0 12px; }
  p { color:var(--muted); line-height:1.7; max-width:390px; margin:0 0 28px; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; }
  a { display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:13px 19px; border-radius:999px; text-decoration:none; font-weight:800; font-size:.9rem; transition:transform .2s,background .2s; }
  a:hover { transform:translateY(-3px); }.primary { background:var(--lime); color:#121827; box-shadow:0 8px 28px #c7ff6b25; }.secondary { color:var(--ink); border:1px solid #ffffff2c; background:#ffffff08; }
  .scene { order:2; min-height:430px; display:grid; place-items:center; position:relative; }
  .planet { position:absolute; width:min(34vw,310px); aspect-ratio:1; border-radius:50%; background:linear-gradient(145deg,#303f5b,#11192b 70%); box-shadow:inset -20px -22px 45px #030611,0 0 90px #516eaa1a; }
  .planet:before,.planet:after { content:""; position:absolute; border-radius:50%; background:#5e6d86; opacity:.22; }.planet:before { width:55px;height:18px;top:28%;left:22%;transform:rotate(-25deg); }.planet:after { width:28px;height:28px;top:62%;left:63%; }
  .orbit { position:absolute; width:min(47vw,440px); aspect-ratio:1; border:1px solid #a6b6d51c; border-radius:50%; transform:rotate(-24deg) scaleY(.42); }.orbit:after { content:""; position:absolute; width:10px;height:10px;border-radius:50%;background:var(--orange);top:12%;left:18%;box-shadow:0 0 20px var(--orange); }
  .robot { position:relative; z-index:2; width:190px; height:260px; animation:bop .85s ease-in-out infinite alternate; transform-origin:50% 85%; filter:drop-shadow(0 25px 18px #0006); }
  .antenna { position:absolute; width:5px;height:34px;background:#9ca9bc;left:94px;top:-17px;border-radius:5px;transform:rotate(12deg); }.antenna:after { content:"";position:absolute;top:-9px;left:-5px;width:15px;height:15px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px #c7ff6b88; }
  .head { position:absolute; left:23px;top:13px;width:145px;height:108px;border:5px solid #7f8da3;border-radius:31px 31px 25px 25px;background:linear-gradient(145deg,#f7d7a1,#d99a5e);box-shadow:inset -10px -10px 0 #a66d3d35,inset 4px 5px 0 #fff8; }
  .face { position:absolute;inset:15px 13px 18px;background:#172238;border:4px solid #56667d;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:17px; }.eye { width:22px;height:30px;background:var(--lime);border-radius:50% 50% 42% 42%;box-shadow:0 0 15px #c7ff6b66;animation:blink 4s infinite; }
  .bodybot { position:absolute;top:126px;left:39px;width:114px;height:82px;border-radius:22px 22px 28px 28px;background:linear-gradient(145deg,#f2bd79,#b97945);border:5px solid #8794a8;box-shadow:inset -8px -7px 0 #764b2d35; }.panel { position:absolute;left:32px;top:17px;width:39px;height:25px;border-radius:8px;background:#172238;border:3px solid #56667d; }.panel:after { content:"";position:absolute;left:8px;top:6px;width:15px;height:5px;border-radius:5px;background:var(--lime); }
  .arm { position:absolute;top:134px;width:28px;height:72px;background:linear-gradient(90deg,#b87b48,#f4c78b);border:4px solid #8794a8;border-radius:18px;transform-origin:50% 12%; }.arm.left { left:13px;animation:waveL .65s ease-in-out infinite alternate; }.arm.right { right:8px;animation:waveR .65s ease-in-out infinite alternate; }.hand { position:absolute;bottom:-11px;left:-5px;width:29px;height:24px;border-radius:50%;background:#f2c68c;border:4px solid #8794a8; }
  .leg { position:absolute;top:198px;width:31px;height:44px;border-radius:12px;background:#aeb8c7;border:4px solid #748198;transform-origin:50% 0; }.leg.left {left:52px;animation:stepL .42s ease-in-out infinite alternate;}.leg.right {right:52px;animation:stepR .42s ease-in-out infinite alternate;}.foot { position:absolute;bottom:-5px;left:-8px;width:44px;height:17px;border-radius:12px 12px 8px 8px;background:#e9b777;border:4px solid #8794a8; }
  .shadow { position:absolute;z-index:1;bottom:52px;width:190px;height:22px;background:#0005;filter:blur(12px);border-radius:50%;animation:shadow .85s ease-in-out infinite alternate; }
  .float-tag { position:absolute;z-index:3;padding:9px 12px;border:1px solid #ffffff1e;background:#111a2bd9;border-radius:12px;color:#dbe4f4;font-size:.75rem;font-weight:700;letter-spacing:.04em; }.tag-one { top:17%;right:0;transform:rotate(7deg); }.tag-two { bottom:18%;left:0;transform:rotate(-8deg);color:var(--lime); }
  .hint { position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#69748b;white-space:nowrap; }
  @keyframes bop { from{transform:translateY(0) rotate(-3deg)} to{transform:translateY(-13px) rotate(3deg)} } @keyframes waveL {from{transform:rotate(28deg)}to{transform:rotate(-38deg)}} @keyframes waveR {from{transform:rotate(-28deg)}to{transform:rotate(38deg)}} @keyframes stepL {from{transform:rotate(-20deg)}to{transform:rotate(22deg)}} @keyframes stepR {from{transform:rotate(20deg)}to{transform:rotate(-22deg)}} @keyframes shadow {from{transform:scaleX(.85);opacity:.35}to{transform:scaleX(1.15);opacity:.65}} @keyframes blink {0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.12)}} @keyframes twinkle {from{opacity:.35}to{opacity:.85}}
  @media(max-width:680px) { body { overflow:auto; min-height:100svh; }.wrap { grid-template-columns:1fr; gap:0; padding:32px 0 52px; text-align:center; }.copy { order:2; }.scene { order:1;min-height:330px; }.planet {width:240px}.orbit {width:320px}.robot {transform:scale(.82);margin-top:0}.copy p {margin-left:auto;margin-right:auto}.actions {justify-content:center}.tag-one {right:4%;top:13%}.tag-two {left:4%;bottom:12%}.hint {position:static;grid-column:1;margin-top:25px;transform:none} }
  @media(prefers-reduced-motion:reduce) { *,*:before,*:after {animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;} }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main class="wrap">
  <section class="copy">
    <div class="eyebrow"><span class="dot"></span> Signal lost · Page not found</div>
    <h1>4<span>0</span>4</h1>
    <h2>Oops… wrong galaxy.</h2>
    <p>Our little space bot danced a little too far and misplaced this page. Let’s get you back on the right orbit.</p>
    <div class="actions">
      <a class="primary" href="https://lagale.in/" aria-label="Go back to Lagale home">← Back to home</a>
      <a class="secondary" id="backButton" href="https://lagale.in/">Go back ↗</a>
    </div>
  </section>
  <section class="scene" aria-label="A little robot dancing in space">
    <div class="orbit"></div><div class="planet"></div>
    <div class="float-tag tag-one">♪ GROOVE MODE: ON</div>
    <div class="float-tag tag-two">404.exe 🤖</div>
    <div class="shadow"></div>
    <div class="robot" aria-hidden="true">
      <div class="antenna"></div><div class="head"><div class="face"><span class="eye"></span><span class="eye"></span></div></div>
      <div class="arm left"><div class="hand"></div></div><div class="arm right"><div class="hand"></div></div>
      <div class="bodybot"><div class="panel"></div></div><div class="leg left"><div class="foot"></div></div><div class="leg right"><div class="foot"></div></div>
    </div>
  </section>
  <div class="hint">Made of stardust &amp; questionable dance moves</div>
</main>
<script>
  (function () {
    const button = document.getElementById("backButton");
    const home = "https://lagale.in/";
    button.addEventListener("click", function (event) {
      event.preventDefault();
      let sameSiteReferrer = false;
      try {
        sameSiteReferrer = Boolean(document.referrer) &&
          new URL(document.referrer).origin === window.location.origin;
      } catch (_) {}
      if (sameSiteReferrer && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = home;
      }
    });
  })();
</script>
</body>
</html>
