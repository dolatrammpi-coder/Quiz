<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>प्राचीन भारत - Basic Quiz | My Study Portal</title>
<meta name="description" content="प्राचीन भारत के बुनियादी प्रश्न">
<link rel="stylesheet" href="/Quiz/style-common.css">
<base href="/Quiz/">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#172033;font-family:Arial,"Noto Sans Devanagari",sans-serif}.head{background:#075be7;color:#fff;padding:12px 0;position:sticky;top:0;z-index:50}.wrap{width:min(960px,94%);margin:auto}.headin{display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:800}.timer{background:#064fbf;padding:8px 13px;border-radius:9px;font-weight:900;font-family:monospace;font-size:15px}.crumb{background:#fff;padding:8px 0;font-size:12px;color:#64748b}.crumb a{color:#334155}.quiz-shell{background:#e4e9f1;border-radius:20px;padding:9px;margin:12px 0}.quiz-card{background:#fff;border-radius:16px;padding:17px;min-height:500px;display:flex;flex-direction:column}.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.badge{background:#e4efff;color:#075be7;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}.question{border-bottom:2px solid #eef0f3;padding:13px 0;font-size:19px;font-weight:700;line-height:1.6}.options{padding:14px 0;display:grid;gap:10px}.option{width:100%;text-align:left;border:2px solid #e3e7ed;background:#fff;border-radius:13px;padding:13px 14px;font-size:16px;cursor:pointer;transition:.15s}.option:hover{background:#f8fafc;border-color:#cbd5e1}.option.selected{border-color:#1769d2;background:#eef5ff;font-weight:700}.option.correct{border-color:#22c55e;background:#dcfce7}.option.wrong{border-color:#ef4444;background:#fee2e2}.nav-buttons{margin-top:auto;padding-top:14px;border-top:1px solid #e5e7eb;display:flex;gap:7px}.nav-buttons button{flex:1;border:0;border-radius:11px;padding:12px;font-size:15px;font-weight:800;cursor:pointer}.prev{background:#e5e7eb;color:#475569}.submit{background:#ff3341;color:#fff}.next{background:#0968e8;color:#fff}.result{text-align:center;padding:30px 0}.result h2{font-size:28px;margin:0 0 10px}.score{font-size:48px;font-weight:900;color:#075be7}.retry{background:#0968e8;color:#fff;border:0;border-radius:11px;padding:14px 25px;font-size:16px;font-weight:800;cursor:pointer;margin-top:15px}@media(max-width:650px){.question{font-size:17px}.option{padding:11px}.wrap{width:min(100% - 24px,680px)}}
</style>
</head>
<body>
<header class="head"><div class="wrap headin"><a class="brand" href="/Quiz/index.html">📚 My Study Portal</a><div class="timer" id="timer">00:00</div></div></header>
<nav class="crumb"><div class="wrap"><a href="/Quiz/index.html">Home</a> › <a href="/Quiz/history/index.html">History</a> › <a href="/Quiz/history/prachin-bharat/index.html">प्राचीन भारत</a> › <span>प्राचीन भारत - Basic Quiz</span></div></nav>
<main class="wrap">
<div class="quiz-shell"><div class="quiz-card" id="quizCard">
<div class="qtop"><span class="badge" id="qBadge">प्रश्न 1/5</span></div>
<div class="question" id="qText">प्रश्न लोड हो रहा है...</div>
<div class="options" id="qOptions"></div>
<div class="nav-buttons"><button class="prev" id="prevBtn">← पिछला</button><button class="submit" id="submitBtn">Submit</button><button class="next" id="nextBtn">अगला →</button></div>
</div></div>
<div id="resultBox" class="quiz-card result" style="display:none">
<h2>🎯 Result</h2>
<div class="score" id="scoreText">0/5</div>
<p id="resultMsg"></p>
<button class="retry" onclick="location.reload()">🔄 Retry</button>
</div>
</main>
<script>
const QUIZ_DATA = [{"question": "हड़प्पा सभ्यता का समय क्या है?", "options": ["2500-1750 ई.पू.", "3000-2000 ई.पू.", "2000-1500 ई.पू.", "1500-1000 ई.पू."], "answer": 0, "explanation": "हड़प्पा सभ्यता 2500-1750 ई.पू. की है"}, {"question": "मोहनजोदड़ो की खोज किसने की?", "options": ["दयाराम साहनी", "राखालदास बनर्जी", "जेम्स प्रिंसेप", "अलेक्जेंडर कनिंघम"], "answer": 1, "explanation": "राखालदास बनर्जी ने 1922 में मोहनजोदड़ो की खोज की"}, {"question": "हड़प्पा सभ्यता का प्रमुख बंदरगाह कौन-सा था?", "options": ["कालीबंगा", "धोलावीरा", "लोथल", "मोहनजोदड़ो"], "answer": 2, "explanation": "लोथल हड़प्पा सभ्यता का प्रमुख बंदरगाह था"}, {"question": "हड़प्पा के लोग किस धातु से परिचित नहीं थे?", "options": ["ताँबा", "कांसा", "सोना", "लोहा"], "answer": 3, "explanation": "हड़प्पा के लोग लोहे से परिचित नहीं थे"}, {"question": "कपास की खेती सबसे पहले कहाँ हुई?", "options": ["मिस्र", "चीन", "हड़प्पा", "मेसोपोटामिया"], "answer": 2, "explanation": "कपास की खेती सबसे पहले हड़प्पा सभ्यता में हुई"}];
const total = QUIZ_DATA.length;
let current = 0;
let answers = {};
let timer;
let seconds = 0;

const qText = document.getElementById("qText");
const qOptions = document.getElementById("qOptions");
const qBadge = document.getElementById("qBadge");
const timerEl = document.getElementById("timer");

function loadQuestion(i) {
    const q = QUIZ_DATA[i];
    qBadge.textContent = `प्रश्न ${i+1}/${total}`;
    qText.textContent = q.question;
    qOptions.innerHTML = "";
    q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = `${String.fromCharCode(65+idx)}. ${opt}`;
        if (answers[i] === idx) btn.classList.add("selected");
        btn.onclick = () => selectOption(i, idx);
        qOptions.appendChild(btn);
    });
}

function selectOption(qIdx, optIdx) {
    answers[qIdx] = optIdx;
    document.querySelectorAll(".option").forEach((btn, i) => {
        btn.classList.toggle("selected", i === optIdx);
    });
}

document.getElementById("prevBtn").onclick = () => { if(current > 0) { current--; loadQuestion(current); }};
document.getElementById("nextBtn").onclick = () => { if(current < total-1) { current++; loadQuestion(current); }};
document.getElementById("submitBtn").onclick = () => {
    clearInterval(timer);
    let score = 0;
    QUIZ_DATA.forEach((q, i) => { if(answers[i] === q.answer) score++; });
    document.getElementById("quizCard").style.display = "none";
    document.getElementById("resultBox").style.display = "block";
    document.getElementById("scoreText").textContent = `${score}/${total}`;
    document.getElementById("resultMsg").textContent = score >= total/2 ? "✅ अच्छा प्रदर्शन!" : "📚 और अभ्यास करें!";
};

function startTimer() {
    timer = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds/60)).padStart(2,"0");
        const s = String(seconds%60).padStart(2,"0");
        timerEl.textContent = `${m}:${s}`;
    }, 1000);
}

loadQuestion(0);
startTimer();
</script>
</body>
</html>
