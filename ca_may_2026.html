<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Affairs June 2026 Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .option-card {
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .option-card:hover {
            transform: translateY(-2px);
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534;
        }

        .option-wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b;
        }

        .palette-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .palette-answered {
            background-color: #2563eb !important;
            color: white;
        }

        .palette-current {
            outline: 3px solid #fbbf24;
            outline-offset: 2px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="current_affairs.html" class="hover:bg-blue-800 p-2 rounded-lg transition">
                <i class="fas fa-arrow-left mr-2"></i> वापस जाएँ
            </a>
            <h1 class="text-xl font-bold">करेंट अफेयर्स जून 2026</h1>
            <div id="timer" class="bg-blue-600 px-3 py-1 rounded font-mono">00:00</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-4">
        <!-- Progress Bar -->
        <div class="mb-6 bg-gray-200 rounded-full h-2.5 overflow-hidden">
            <div id="progress-bar" class="bg-blue-600 h-2.5 transition-all duration-500" style="width: 0%"></div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="glass-morphism rounded-2xl shadow-xl p-6 mb-8">
            <div class="flex justify-between items-center mb-6">
                <span id="question-number" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold text-sm">प्रशन 1 / 247</span>
                <button onclick="shuffleQuiz()" class="text-gray-600 hover:text-blue-600 font-medium transition">
                    <i class="fas fa-random mr-1"></i> शफल
                </button>
            </div>

            <div id="question-content" class="animate-fade">
                <h2 id="question-text" class="text-xl font-semibold text-gray-800 mb-6 leading-relaxed">
                    लोडिंग...
                </h2>
                
                <div id="options-list" class="space-y-4">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex flex-wrap justify-between items-center mt-10 gap-4">
                <button id="prev-btn" onclick="prevQuestion()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 disabled:opacity-50 transition flex-1 sm:flex-none">
                    <i class="fas fa-chevron-left mr-2"></i> पिछला
                </button>
                
                <div class="flex gap-2 flex-1 sm:flex-none">
                    <button id="submit-btn" onclick="checkSubmission()" class="px-8 py-3 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 transition flex-1">
                        सबमिट करें
                    </button>
                    <button id="next-btn" onclick="nextQuestion()" class="px-10 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition flex-1">
                        अगला <i class="fas fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Smart Navigation Palette -->
        <div class="glass-morphism rounded-2xl shadow-lg p-4">
            <h3 class="text-gray-700 font-bold mb-4 flex items-center">
                <i class="fas fa-th mr-2 text-blue-600"></i> प्रश्न पैलेट
            </h3>
            <div id="question-palette" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 lg:grid-cols-12 gap-2 max-h-48 overflow-y-auto p-2 custom-scrollbar">
                <!-- Palette buttons injected here -->
            </div>
            <div class="mt-4 flex gap-4 text-xs font-medium text-gray-500">
                <div class="flex items-center"><span class="w-3 h-3 bg-blue-600 rounded-sm mr-1"></span> हल किया</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-gray-200 rounded-sm mr-1"></span> शेष</div>
                <div class="flex items-center"><span class="w-3 h-3 border-2 border-yellow-400 rounded-sm mr-1"></span> वर्तमान</div>
            </div>
        </div>
    </main>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-8 shadow-2xl custom-scrollbar animate-fade">
            <div class="text-center mb-8">
                <div id="result-icon" class="text-6xl mb-4">🏆</div>
                <h2 id="result-title" class="text-3xl font-bold text-gray-800 mb-2">शानदार प्रदर्शन!</h2>
                <p id="result-score" class="text-xl text-blue-600 font-bold">आपका स्कोर: 85%</p>
                <div id="score-stats" class="mt-4 flex justify-center gap-6 text-sm">
                    <span class="text-green-600 font-bold" id="stat-correct">सही: 0</span>
                    <span class="text-red-600 font-bold" id="stat-wrong">गलत: 0</span>
                    <span class="text-gray-500 font-bold" id="stat-left">छूटे: 0</span>
                </div>
            </div>

            <div id="review-section" class="space-y-6 mb-8 border-t pt-6">
                <h3 class="font-bold text-lg text-gray-700 mb-4">विस्तृत समीक्षा</h3>
                <!-- Review cards -->
            </div>

            <div class="flex flex-col sm:flex-row gap-4 sticky bottom-0 bg-white pt-4 pb-2 border-t mt-4">
                <button onclick="retestWrongOnly()" id="retest-btn" class="flex-1 bg-orange-500 text-white py-4 rounded-2xl font-bold hover:bg-orange-600 transition flex items-center justify-center">
                    <i class="fas fa-redo-alt mr-2"></i> केवल गलत/छूटे प्रश्न (Re-test)
                </button>
                <button onclick="restartQuiz()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition flex items-center justify-center">
                    <i class="fas fa-sync mr-2"></i> पूर्ण रिस्टार्ट
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure for 247 Questions (Sampling first 20 as placeholder)
        const allQuestionsData = [
    { id: 1, q: "हाल ही में दिवंगत भरत कपूर कौन थे?", options: ["गायक", "लेखक", "अभिनेता", "खिलाड़ी"], correct: 2, rationale: "भरत कपूर हिंदी सिनेमा और टेलीविजन के एक जाने-माने अभिनेता थे। उन्होंने कई प्रसिद्ध फिल्मों में चरित्र अभिनेता और खलनायक की भूमिका निभाई थी।" },
    { id: 2, q: "हाल ही में 40वां राष्ट्रीय शिखर सम्मेलन का आयोजन कहाँ किया जा रहा है?", options: ["जयपुर", "चंडीगढ़", "भोपाल", "लखनऊ"], correct: 1, rationale: "यह सम्मेलन चंडीगढ़ में आयोजित किया जा रहा है, जिसमें विभिन्न राज्यों के प्रतिनिधि और विशेषज्ञ राष्ट्रीय महत्व के मुद्दों पर चर्चा कर रहे हैं।" },
    { id: 3, q: "हाल ही में भारत ने एशियन बीच गेम्स 2026 में कुल कितने पदक जीते हैं?", options: ["6", "8", "10", "12"], correct: 0, rationale: "भारत ने इस संस्करण में बेहतरीन प्रदर्शन करते हुए कुल 6 पदक अपने नाम किए हैं, जिसमें कुछ महत्वपूर्ण स्वर्ण पदक भी शामिल हैं।" },
    { id: 4, q: "हाल ही में मुरली श्रीशंकर ने सिम्बाइन क्लासिक एथलेटिक्स मीट में पुरुषों की लंबी कूद में कौन सा पदक जीता है?", options: ["स्वर्ण पदक", "रजत पदक", "कांस्य पदक", "कोई पदक नहीं"], correct: 0, rationale: "भारतीय लॉन्ग जम्पर मुरली श्रीशंकर ने इस एथलेटिक्स मीट में शानदार प्रदर्शन करते हुए स्वर्ण पदक हासिल किया है।" },
    { id: 5, q: "हाल ही में बहुपक्षीय सैन्य अभ्यास 'प्रगति' का उद्घाटन सत्र कहाँ आयोजित किया गया?", options: ["मेघालय", "असम", "नागालैंड", "मणिपुर"], correct: 0, rationale: "पूर्वोत्तर में सैन्य सहयोग और रणनीतिक साझेदारी को बढ़ावा देने के लिए इसका आयोजन मेघालय के उमरोई में किया गया।" },
    { id: 6, q: "हाल ही में 'मिशन सक्षम' किसने लॉन्च किया है?", options: ["नीति आयोग", "वित्त मंत्रालय", "भारतीय स्टेट बैंक", "भारतीय रिज़र्व बैंक"], correct: 3, rationale: "भारतीय रिज़र्व बैंक (RBI) ने वित्तीय साक्षरता और समावेशन को बढ़ावा देने के उद्देश्य से 'मिशन सक्षम' की शुरुआत की है।" },
    { id: 7, q: "हाल ही में AIFF एलीट यूथ लीग का खिताब किसने जीता है?", options: ["पंजाब FC", "मोहन बागान", "बेंगलुरु FC", "ज़िंक फुटबॉल अकादमी"], correct: 0, rationale: "पंजाब FC की युवा टीम ने फाइनल में शानदार प्रदर्शन करते हुए AIFF एलीट यूथ लीग का खिताब अपने नाम किया।" },
    { id: 8, q: "हाल ही में राजस्थान का पहला 'वाटर-पॉजिटिव' हवाई अड्डा कौन सा बना है?", options: ["उदयपुर हवाई अड्डा", "जयपुर हवाई अड्डा", "जोधपुर हवाई अड्डा", "बीकानेर हवाई अड्डा"], correct: 1, rationale: "जयपुर अंतर्राष्ट्रीय हवाई अड्डा जल संरक्षण और रिसाइकिलिंग के बेहतरीन उपायों के चलते राजस्थान का पहला वाटर-पॉजिटिव एयरपोर्ट बन गया है।" },
    { id: 9, q: "हाल ही में कौन सा राज्य 'उग्रवाद-मुक्त' समझौते की ओर बढ़ा है?", options: ["नागालैंड", "मणिपुर", "मिजोरम", "असम"], correct: 3, rationale: "असम सरकार और विभिन्न विद्रोही गुटों के बीच हुए शांति समझौतों के बाद असम एक उग्रवाद-मुक्त राज्य बनने की दिशा में तेजी से आगे बढ़ा है।" },
    { id: 10, q: "हाल ही में निर्वाचन आयोग (ECI) की QR कोड आधारित फोटो पहचान पत्र (ID) प्रणाली कब से शुरू की गई?", options: ["10 मई", "12 मई", "13 मई", "14 मई"], correct: 3, rationale: "चुनाव प्रक्रिया को और अधिक पारदर्शी और सुरक्षित बनाने के लिए ECI ने 14 मई से डिजिटल QR कोड आधारित वोटर आईडी प्रणाली शुरू की।" },
    { id: 11, q: "हाल ही में किस श्रेणी का महेंद्रगिरी जहाज नौसेना को सौंपा गया है?", options: ["शिवालिक श्रेणी", "तलवार श्रेणी", "नीलगिरि श्रेणी", "कोलकाता श्रेणी"], correct: 2, rationale: "महेंद्रगिरी प्रोजेक्ट 17A के तहत निर्मित नीलगिरि श्रेणी का सातवां और अंतिम स्टील्थ फ्रिगेट है, जिसे मझगांव डॉक शिपबिल्डर्स द्वारा बनाया गया है।" },
    { id: 12, q: "हाल ही में केंद्रीय मंत्री नितिन गडकरी ने भारत का पहला मल्टी-लेन फ्री फ्लो बेरियर-रहित टोलिंग सिस्टम कहाँ लॉन्च किया है?", options: ["महाराष्ट्र", "राजस्थान", "उत्तर प्रदेश", "गुजरात"], correct: 0, rationale: "यातायात को सुगम बनाने के लिए महाराष्ट्र (विशेषकर मुंबई के पास) में भारत का पहला बिना बैरियर वाला फ्री-फ्लो टोल सिस्टम शुरू किया गया है।" },
    { id: 13, q: "हाल ही में किस भारतीय को व्हिटली पुरस्कार (ग्रीन ऑस्कर) से सम्मानित किया गया है?", options: ["पूर्णिमा देवी बर्मन", "बरखा सुब्बा और परवीन शेख", "सुनीता नारायण और वंदना शिवा", "रितु करिधल और वंदना शिवा"], correct: 0, rationale: "असम की वन्यजीव वैज्ञानिक डॉ. पूर्णिमा देवी बर्मन को 'हरगिला' (ग्रेटर एडजुटेंट स्टॉर्क) पक्षी के संरक्षण के लिए दूसरी बार प्रतिष्ठित व्हिटली पुरस्कार से सम्मानित किया गया है।" },
    { id: 14, q: "हाल ही में फॉर्मूला 1 समर्थित सिम रेसिंग पहल के लिए ब्रांड एंबेसडर किसे नियुक्त किया गया है?", options: ["विराट कोहली", "हार्दिक पांड्या", "केएल राहुल", "युवराज सिंह"], correct: 3, rationale: "मोटरस्पोर्ट्स और ई-स्पोर्ट्स को भारत में बढ़ावा देने के लिए पूर्व भारतीय क्रिकेटर युवराज सिंह को सिम रेसिंग का ब्रांड एंबेसडर बनाया गया है।" },
    { id: 15, q: "1 मई को किन राज्यों का स्थापना दिवस मनाया जाता है?", options: ["महाराष्ट्र और गुजरात", "असम और अरुणाचल प्रदेश", "गुजरात और मध्य प्रदेश", "तमिलनाडू और कर्नाटक"], correct: 0, rationale: "1 मई 1960 को बॉम्बे पुनर्गठन अधिनियम के तहत भाषाई आधार पर महाराष्ट्र और गुजरात राज्य अस्तित्व में आए थे।" },
    { id: 16, q: "अंतर्राष्ट्रीय श्रमिक दिवस कब मनाया जाता है?", options: ["1 मई", "30 अप्रैल", "2 मई", "3 मई"], correct: 0, rationale: "मज़दूरों के अधिकारों और उनके योगदान को सम्मानित करने के लिए हर साल 1 मई को अंतर्राष्ट्रीय श्रमिक दिवस (May Day) मनाया जाता है।" },
    { id: 17, q: "भारतीय सेना ने 'ऑपरेशन नेत्रा' के तहत विशाल नेत्र शिविर कहाँ आयोजित किया है?", options: ["श्रीनगर", "कारगिल", "जम्मू", "लद्दाख"], correct: 1, rationale: "भारतीय सेना ने स्थानीय नागरिकों की स्वास्थ्य देखभाल और सद्भावना के तहत कारगिल (लद्दाख क्षेत्र) में एक बड़ा नेत्र चिकित्सा शिविर आयोजित किया।" },
    { id: 18, q: "हाल ही में दिवंगत विजय कुमार का संबंध किस खेल से था?", options: ["गोल्फ", "क्रिकेट", "हॉकी", "टेनिस"], correct: 0, rationale: "विजय कुमार भारत के प्रसिद्ध पेशेवर गोल्फर थे, जिन्होंने कई राष्ट्रीय और अंतर्राष्ट्रीय टूर्नामेंटों में देश का प्रतिनिधित्व किया था।" },
    { id: 19, q: "दुनिया की पहली ज़ीरो एमिशन कोल बैटरी किसने पेश की है?", options: ["चीन", "USA", "जापान", "जर्मनी"], correct: 0, rationale: "चीन के शोधकर्ताओं ने एक ऐसी बैटरी विकसित की है जो कोयले से ऊर्जा पैदा करती है लेकिन इसमें कार्बन उत्सर्जन (Zero Emission) शून्य होता है।" },

        let questions = [...allQuestionsData];
        let currentIndex = 0;
        let userAnswers = {}; // {questionId: selectedOptionIndex}
        let isRetestMode = false;

        // Initialize Quiz
        function initQuiz() {
            renderQuestion();
            renderPalette();
            updateProgress();
            startTime();
        }

        // Render Current Question
        function renderQuestion() {
            const q = questions[currentIndex];
            const qText = document.getElementById('question-text');
            const optionsList = document.getElementById('options-list');
            const qNum = document.getElementById('question-number');

            qNum.innerText = `प्रश्न ${currentIndex + 1} / ${questions.length}`;
            qText.innerText = q.q;
            optionsList.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('div');
                btn.className = `option-card p-4 rounded-xl border-2 flex justify-between items-center ${userAnswers[q.id] === index ? (index === q.correct ? 'option-correct' : 'option-wrong') : 'bg-white border-gray-100'}`;
                
                // If already answered, show correct/wrong state
                if (userAnswers[q.id] !== undefined) {
                    if (index === q.correct) btn.classList.add('option-correct');
                    if (userAnswers[q.id] === index && index !== q.correct) btn.classList.add('option-wrong');
                }

                btn.innerHTML = `
                    <span class="font-medium">${index + 1}. ${opt}</span>
                    ${userAnswers[q.id] === index ? (index === q.correct ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>') : ''}
                `;
                
                btn.onclick = () => selectOption(index);
                optionsList.appendChild(btn);
            });

            // Update Palette Current State
            document.querySelectorAll('.palette-btn').forEach(btn => btn.classList.remove('palette-current'));
            const currentBtn = document.querySelector(`[data-idx="${currentIndex}"]`);
            if (currentBtn) currentBtn.classList.add('palette-current');

            // Toggle Nav Buttons
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').style.display = currentIndex === questions.length - 1 ? 'none' : 'block';
        }

        // Handle Option Selection
        function selectOption(idx) {
            const q = questions[currentIndex];
            if (userAnswers[q.id] !== undefined) return; // Prevent re-selection

            userAnswers[q.id] = idx;
            renderQuestion();
            renderPalette();
            updateProgress();
            
            // Auto scroll to next after delay
            setTimeout(() => {
                if (currentIndex < questions.length - 1) nextQuestion();
            }, 600);
        }

        // Palette Rendering
        function renderPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                const isAnswered = userAnswers[q.id] !== undefined;
                btn.className = `palette-btn ${isAnswered ? 'palette-answered' : 'bg-gray-200 text-gray-600'} hover:bg-blue-400 hover:text-white`;
                btn.innerText = index + 1;
                btn.setAttribute('data-idx', index);
                btn.onclick = () => {
                    currentIndex = index;
                    renderQuestion();
                };
                palette.appendChild(btn);
            });
        }

        // Navigation
        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        // Shuffle
        function shuffleQuiz() {
            if (confirm("क्या आप प्रश्नों और विकल्पों को शफल करना चाहते हैं? आपकी प्रगति रीसेट हो जाएगी।")) {
                userAnswers = {};
                questions = questions.sort(() => Math.random() - 0.5);
                questions.forEach(q => {
                    // Also shuffle options if needed
                    // let originalCorrect = q.options[q.correct];
                    // q.options = q.options.sort(() => Math.random() - 0.5);
                    // q.correct = q.options.indexOf(originalCorrect);
                });
                currentIndex = 0;
                initQuiz();
            }
        }

        // Submission Check
        function checkSubmission() {
            const answeredCount = Object.keys(userAnswers).length;
            const remaining = questions.length - answeredCount;

            if (remaining > 0) {
                if (confirm(`अलर्ट: आपने अभी ${remaining} प्रश्न नहीं किए हैं। क्या आप फिर भी सबमिट करना चाहते हैं?`)) {
                    showResult();
                }
            } else {
                showResult();
            }
        }

        // Result & Review
        function showResult() {
            let correct = 0;
            questions.forEach(q => {
                if (userAnswers[q.id] === q.correct) correct++;
            });

            const scorePercent = Math.round((correct / questions.length) * 100);
            const statWrong = Object.keys(userAnswers).length - correct;
            const statLeft = questions.length - Object.keys(userAnswers).length;

            document.getElementById('stat-correct').innerText = `सही: ${correct}`;
            document.getElementById('stat-wrong').innerText = `गलत: ${statWrong}`;
            document.getElementById('stat-left').innerText = `छूटे: ${statLeft}`;
            document.getElementById('result-score').innerText = `आपका स्कोर: ${scorePercent}% (${correct}/${questions.length})`;

            const title = document.getElementById('result-title');
            const icon = document.getElementById('result-icon');
            if (scorePercent >= 80) { title.innerText = "उत्कृष्ट प्रदर्शन!"; icon.innerText = "🏆"; }
            else if (scorePercent >= 50) { title.innerText = "अच्छा प्रयास!"; icon.innerText = "👏"; }
            else { title.innerText = "थोड़ा और अभ्यास करें!"; icon.innerText = "📚"; }

            // Review List
            const reviewSec = document.getElementById('review-section');
            reviewSec.innerHTML = '<h3 class="font-bold text-lg text-gray-700 mb-4">विस्तृत समीक्षा</h3>';
            
            questions.forEach((q, i) => {
                const isCorrect = userAnswers[q.id] === q.correct;
                const statusColor = userAnswers[q.id] === undefined ? 'text-gray-400' : (isCorrect ? 'text-green-600' : 'text-red-600');
                
                const card = document.createElement('div');
                card.className = "p-4 rounded-xl bg-gray-50 border-l-4 " + (isCorrect ? "border-green-500" : (userAnswers[q.id] === undefined ? "border-gray-300" : "border-red-500"));
                card.innerHTML = `
                    <p class="font-bold text-gray-800 mb-1">${i + 1}. ${q.q}</p>
                    <p class="text-sm">आपका उत्तर: <span class="font-bold ${statusColor}">${userAnswers[q.id] !== undefined ? q.options[userAnswers[q.id]] : 'छोड़ दिया'}</span></p>
                    <p class="text-sm text-green-700">सही उत्तर: <span class="font-bold">${q.options[q.correct]}</span></p>
                `;
                reviewSec.appendChild(card);
            });

            document.getElementById('result-modal').classList.remove('hidden');
        }

        // Re-test Mode
        function retestWrongOnly() {
            const wrongOrUnanswered = allQuestionsData.filter(q => userAnswers[q.id] === undefined || userAnswers[q.id] !== q.correct);
            
            if (wrongOrUnanswered.length === 0) {
                alert("बधाई हो! आपके सभी उत्तर सही हैं। री-टेस्ट की आवश्यकता नहीं है।");
                return;
            }

            questions = [...wrongOrUnanswered];
            userAnswers = {};
            currentIndex = 0;
            isRetestMode = true;
            document.getElementById('result-modal').classList.add('hidden');
            initQuiz();
        }

        // Full Restart
        function restartQuiz() {
            questions = [...allQuestionsData];
            userAnswers = {};
            currentIndex = 0;
            isRetestMode = false;
            document.getElementById('result-modal').classList.add('hidden');
            initQuiz();
        }

        function updateProgress() {
            const count = Object.keys(userAnswers).length;
            const percent = (count / questions.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
        }

        // Timer
        let seconds = 0;
        function startTime() {
            setInterval(() => {
                seconds++;
                let m = Math.floor(seconds / 60);
                let s = seconds % 60;
                document.getElementById('timer').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
        });

        window.onload = initQuiz;
    </script>
