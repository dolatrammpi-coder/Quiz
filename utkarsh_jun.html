<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>करेंट अफेयर्स जून 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; }
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .option-card { transition: all 0.2s ease; cursor: pointer; border: 2px solid transparent; }
        .option-card:hover { transform: translateY(-2px); background-color: #f8fafc; border-color: #cbd5e1; }
        .option-correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534; }
        .option-wrong { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .palette-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 600; border-radius: 8px; transition: all 0.2s; font-size: 0.85rem; }
        .palette-answered { background-color: #2563eb !important; color: white; }
        .palette-current { outline: 3px solid #fbbf24; outline-offset: 2px; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-20" onload="initQuiz()">
    <header class="bg-blue-700 text-white p-2 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center px-2">
            <a href="ca_utkarsh.html" class="hover:bg-blue-800 p-1.5 rounded-lg transition text-sm flex items-center">
                <i class="fas fa-arrow-left mr-1.5"></i> वापस
            </a>
            <h1 class="text-base sm:text-lg font-bold truncate px-2">करेंट अफेयर्स जून 2026</h1>
            <div id="timer" class="bg-blue-600 px-2 py-1 rounded font-mono text-sm">00:00</div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-2">
        
        <div id="quiz-container" class="glass-morphism rounded-2xl shadow-xl p-4 sm:p-6 mb-8 flex flex-col" style="height: 650px;">
            <div class="flex justify-between items-center mb-4" style="height: 30px; min-height: 30px;">
                <span id="question-number" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold text-sm">प्रशन 1 / --</span>
                <button onclick="shuffleQuiz()" class="text-gray-600 hover:text-blue-600 font-medium transition text-sm"><i class="fas fa-random mr-1"></i> शफल</button>
            </div>
            
            <div id="question-content" class="animate-fade flex-1 flex flex-col w-full">
                <div id="q-text-container" class="w-full flex items-center justify-start border-b-2 border-gray-100 pb-2 mb-4 transition-opacity duration-150 overflow-hidden" style="height: 110px; min-height: 90px;">
                    <h2 id="question-text" class="font-semibold text-gray-800 leading-relaxed w-full m-0" style="font-size: 12px;">लोडिंग...</h2>
                </div>
                <div id="options-container" class="w-full flex flex-col justify-start overflow-hidden" style="height: 380px; min-height: 300px;">
                    <div id="options-list" class="space-y-3 w-full"></div>
                </div>
            </div>

            <div class="flex justify-between items-center mt-auto pt-4 border-t border-gray-200 gap-2 w-full">
                <button id="prev-btn" onclick="prevQuestion()" class="w-1/3 py-2.5 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300 disabled:opacity-50 transition text-sm sm:text-base flex justify-center items-center">
                    <i class="fas fa-chevron-left mr-1"></i> पिछला
                </button>
                <button id="submit-btn" onclick="checkSubmission()" class="w-1/3 py-2.5 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 transition text-sm sm:text-base flex justify-center items-center">
                    सबमिट
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="w-1/3 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 disabled:opacity-50 transition text-sm sm:text-base flex justify-center items-center">
                    अगला <i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>

        <div class="glass-morphism rounded-2xl shadow-lg p-4">
            <h3 class="text-gray-700 font-bold mb-4 flex items-center"><i class="fas fa-th mr-2 text-blue-600"></i> प्रश्न पैलेट</h3>
            <div id="question-palette" class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 lg:grid-cols-12 gap-2 max-h-48 overflow-y-auto p-2 custom-scrollbar"></div>
            <div class="mt-4 flex gap-4 text-xs font-medium text-gray-500">
                <div class="flex items-center"><span class="w-3 h-3 bg-blue-600 rounded-sm mr-1"></span> हल किया</div>
                <div class="flex items-center"><span class="w-3 h-3 bg-gray-200 rounded-sm mr-1"></span> शेष</div>
                <div class="flex items-center"><span class="w-3 h-3 border-2 border-yellow-400 rounded-sm mr-1"></span> वर्तमान</div>
            </div>
        </div>

        <!-- NEW: 2 Buttons at the bottom of the page -->
        <div class="flex flex-col sm:flex-row gap-4 mt-8">
            <button onclick="openFlashcardMode()" class="flex-1 py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg flex justify-center items-center">
                <i class="fas fa-layer-group mr-2"></i> बिना विकल्प के क्विज़
            </button>
            <button onclick="openQuestionList()" class="flex-1 py-4 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 transition shadow-lg flex justify-center items-center">
                <i class="fas fa-list-ul mr-2"></i> प्रश्नों की सूची
            </button>
        </div>
    </main>

    <!-- Quiz Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-8 shadow-2xl custom-scrollbar animate-fade">
            <div class="text-center mb-8">
                <div id="result-icon" class="text-6xl mb-4">🏆</div>
                <h2 id="result-title" class="text-3xl font-bold text-gray-800 mb-2">शानदार प्रदर्शन!</h2>
                <p id="result-score" class="text-xl text-blue-600 font-bold">आपका स्कोर: 0%</p>
                <div id="score-stats" class="mt-4 flex justify-center gap-6 text-sm">
                    <span class="text-green-600 font-bold" id="stat-correct">सही: 0</span>
                    <span class="text-red-600 font-bold" id="stat-wrong">गलत: 0</span>
                    <span class="text-gray-500 font-bold" id="stat-left">छूटे: 0</span>
                </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 sticky bottom-0 bg-white pt-4 pb-2 border-t mt-4">
                <button onclick="retestWrongOnly()" id="retest-btn" class="flex-1 bg-orange-500 text-white py-4 rounded-2xl font-bold hover:bg-orange-600 transition flex items-center justify-center"><i class="fas fa-redo-alt mr-2"></i> गलत/छूटे प्रश्न (Re-test)</button>
                <button onclick="restartQuiz()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition flex items-center justify-center"><i class="fas fa-sync mr-2"></i> पूर्ण रिस्टार्ट</button>
            </div>
        </div>
    </div>

    <!-- NEW: Question List Modal -->
    <div id="list-modal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-3xl w-full h-[90vh] flex flex-col shadow-2xl animate-fade">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-3xl">
                <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-list-ul mr-2 text-emerald-600"></i> प्रश्नों की सूची</h2>
                <button onclick="closeListModal()" class="text-gray-500 hover:text-red-500 text-3xl leading-none">&times;</button>
            </div>
            <div id="list-content" class="p-6 overflow-y-auto flex-1 custom-scrollbar space-y-4">
                <!-- List dynamically injected here -->
            </div>
        </div>
    </div>

    <!-- NEW: Flashcard Modal -->
    <div id="flashcard-modal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full min-h-[60vh] flex flex-col shadow-2xl animate-fade p-6 relative">
            <button onclick="closeFlashcardModal()" class="absolute top-4 right-5 text-gray-500 hover:text-red-500 text-3xl leading-none">&times;</button>
            
            <div class="flex-1 flex flex-col justify-center items-center text-center mt-6">
                <span id="fc-number" class="text-sm font-bold text-indigo-700 bg-indigo-100 px-4 py-1 rounded-full mb-6">प्रश्न 1 / --</span>
                <h2 id="fc-question" class="text-xl sm:text-2xl font-semibold text-gray-800 mb-8 leading-relaxed">प्रश्न लोडिंग...</h2>
                
                <button id="fc-show-ans-btn" onclick="showFcAnswer()" class="px-8 py-3 bg-yellow-400 text-gray-800 font-bold rounded-xl shadow hover:bg-yellow-500 transition mb-4">
                    <i class="fas fa-eye mr-2"></i> उत्तर देखें
                </button>
                
                <div id="fc-answer-box" class="hidden w-full p-5 bg-green-50 border-2 border-green-200 rounded-xl mt-4">
                    <p class="text-green-800 font-bold text-lg">उत्तर: <span id="fc-answer-text" class="font-medium text-gray-800 ml-1">...</span></p>
                </div>
            </div>

            <div class="flex justify-between mt-10 gap-4">
                <button onclick="prevFc()" class="px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-300 transition flex-1">
                    <i class="fas fa-chevron-left mr-2"></i> पिछला

                <button onclick="nextFc()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition flex-1">

                </button>
            </div>
        </div>
    </div>

        "options": [
            "Seychelles के उपराष्ट्रपति",
            "Seychelles के प्रधानमंत्री",
            "Seychelles के विदेश मंत्री",
            "Seychelles के राष्ट्रपति डॉ. Patrick Herminie"
        ],
        "correct": 3
    },
    {
        "id": 168,
        "q": "प्रधानमंत्री मोदी को यह सम्मान क्यों दिया गया?",
        "options": [
            "अंतरिक्ष अनुसंधान और परमाणु ऊर्जा सहयोग के लिए",
            "व्यापार और डिजिटल अर्थव्यवस्था के लिए",
            "हरित नेतृत्व तथा Blue Economy, climate action और ocean sustainability में कार्य के लिए",
            "रक्षा सहयोग और सैन्य आधुनिकीकरण के लिए"
        ],
        "correct": 2
    }
];

        let questions = [...allQuestionsData];
        let currentIndex = 0;
        let userAnswers = {};
        let timerInterval;
        let secondsElapsed = 0;

        window.addEventListener('resize', () => { requestAnimationFrame(adjustFontSize); });

        function initQuiz() { 
            if(questions.length === 0) {
                document.getElementById('question-text').innerText = "कोई प्रश्न नहीं मिला। कृपया JSON चेक करें।";
                return;
            }
            renderQuestion(); renderPalette(); startTime(); 
        }

        function renderQuestion() {
            if(questions.length === 0) return;
            const q = questions[currentIndex];
            
            const qContainer = document.getElementById('q-text-container');
            qContainer.style.opacity = '0';

            document.getElementById('question-number').innerText = 'प्रश्न ' + (currentIndex + 1) + ' / ' + questions.length;
            document.getElementById('question-text').innerText = q.q;
            
            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('div');
                let extraClasses = 'bg-white border-gray-100';
                let icon = '';
                if (userAnswers[q.id] !== undefined) {
                    if (index === q.correct) { extraClasses = 'option-correct'; }
                    if (userAnswers[q.id] === index && index !== q.correct) { extraClasses = 'option-wrong'; }
                    if (userAnswers[q.id] === index) { icon = index === q.correct ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>'; }
                }
                btn.className = 'option-card p-2.5 rounded-xl border-2 flex justify-between items-center mb-2 ' + extraClasses;
                
                btn.innerHTML = '<span class="font-medium option-text" style="font-size:15px;">' + (index + 1) + '. ' + opt + '</span>' + icon;
                
                btn.onclick = () => selectOption(index);
                optionsList.appendChild(btn);
            });

            document.querySelectorAll('.palette-btn').forEach(btn => btn.classList.remove('palette-current'));
            const currentBtn = document.querySelector('[data-idx="' + currentIndex + '"]');
            if (currentBtn) currentBtn.classList.add('palette-current');

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;
            
            setTimeout(() => {
                adjustFontSize();
                qContainer.style.opacity = '1';
            }, 10);
        }

        function adjustFontSize() {
            const qContainer = document.getElementById('q-text-container');
            const qText = document.getElementById('question-text');
            
            let qSize = 20; 
            qText.style.fontSize = qSize + 'px';
            
            let sh = qText.scrollHeight;
            let ch = qContainer.clientHeight;
            
            while (sh > ch && qSize > 12) {
                qSize -= 1;
                qText.style.fontSize = qSize + 'px';
                sh = qText.scrollHeight; 
            }
        }

        function selectOption(idx) {
            const q = questions[currentIndex];
            if (userAnswers[q.id] !== undefined) return;
            userAnswers[q.id] = idx;
            renderQuestion(); renderPalette();
            setTimeout(() => { if (currentIndex < questions.length - 1) nextQuestion(); }, 600);
        }

        function renderPalette() {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = '';
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                const isAnswered = userAnswers[q.id] !== undefined;
                btn.className = 'palette-btn ' + (isAnswered ? 'palette-answered' : 'bg-gray-200 text-gray-600') + ' hover:bg-blue-400 hover:text-white';
                btn.innerText = index + 1;
                btn.setAttribute('data-idx', index);
                btn.onclick = () => { currentIndex = index; renderQuestion(); };
                palette.appendChild(btn);
            });
        }

        function startTime() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                let s = (secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = m + ':' + s;
            }, 1000);
        }

        function nextQuestion() { if(currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); } }
        function prevQuestion() { if(currentIndex > 0) { currentIndex--; renderQuestion(); } }
        
        function shuffleQuiz() { 
            questions.sort(() => Math.random() - 0.5); 
            currentIndex = 0; userAnswers = {}; 
            renderQuestion(); renderPalette(); 
        }

        function checkSubmission() {
            clearInterval(timerInterval);
            let correctCount = 0, wrongCount = 0, leftCount = 0;
            questions.forEach(q => {
                if(userAnswers[q.id] === undefined) leftCount++;
                else if(userAnswers[q.id] === q.correct) correctCount++;
                else wrongCount++;
            });
            const percent = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
            
            document.getElementById('result-score').innerText = 'आपका स्कोर: ' + percent + '%';
            document.getElementById('stat-correct').innerText = 'सही: ' + correctCount;
            document.getElementById('stat-wrong').innerText = 'गलत: ' + wrongCount;
            document.getElementById('stat-left').innerText = 'छूटे: ' + leftCount;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function retestWrongOnly() {
            const wrongOrLeft = allQuestionsData.filter(q => userAnswers[q.id] !== q.correct);
            if(wrongOrLeft.length === 0) { alert("सभी उत्तर सही हैं! कोई गलत प्रश्न नहीं बचा।"); return; }
            questions = wrongOrLeft;
            currentIndex = 0; userAnswers = {}; secondsElapsed = 0;
            document.getElementById('result-modal').classList.add('hidden');
            initQuiz();
        }

        function restartQuiz() {
            questions = [...allQuestionsData];
            currentIndex = 0; userAnswers = {}; secondsElapsed = 0;
            document.getElementById('result-modal').classList.add('hidden');
            initQuiz();
        }

        // ==========================================
        // NEW FEATURES: Question List & Flashcard Mode
        // ==========================================

        function openQuestionList() {
            const listContent = document.getElementById('list-content');
            listContent.innerHTML = '';
            questions.forEach((q, i) => {
                const correctOpt = q.options[q.correct] !== undefined ? q.options[q.correct] : "उत्तर उपलब्ध नहीं";
                listContent.innerHTML += '<div class="p-4 bg-gray-50 border border-gray-200 rounded-xl">' +
                    '<p class="font-bold text-gray-800 mb-2">' + (i+1) + '. ' + q.q + '</p>' +
                    '<p class="text-emerald-700 font-semibold"><i class="fas fa-check-circle mr-1"></i> ' + correctOpt + '</p>' +
                '</div>';
            });
            document.getElementById('list-modal').classList.remove('hidden');
        }

        function closeListModal() {
            document.getElementById('list-modal').classList.add('hidden');
        }

        let fcIndex = 0;
        function openFlashcardMode() {
            fcIndex = 0;
            renderFc();
            document.getElementById('flashcard-modal').classList.remove('hidden');
        }

        function closeFlashcardModal() {
            document.getElementById('flashcard-modal').classList.add('hidden');
        }
        
        function renderFc() {
            if(questions.length === 0) return;
            const q = questions[fcIndex];
            document.getElementById('fc-number').innerText = 'प्रश्न ' + (fcIndex + 1) + ' / ' + questions.length;
            document.getElementById('fc-question').innerText = q.q;
            document.getElementById('fc-show-ans-btn').classList.remove('hidden');
            document.getElementById('fc-answer-box').classList.add('hidden');
            
            const correctOpt = q.options[q.correct] !== undefined ? q.options[q.correct] : "उत्तर उपलब्ध नहीं";
            document.getElementById('fc-answer-text').innerText = correctOpt;
        }

        function showFcAnswer() {
            document.getElementById('fc-show-ans-btn').classList.add('hidden');
            document.getElementById('fc-answer-box').classList.remove('hidden');
        }

        function nextFc() {
            if(fcIndex < questions.length - 1) { 
                fcIndex++; 
                renderFc(); 
            }
        }

        function prevFc() {
            if(fcIndex > 0) { 
                fcIndex--; 
                renderFc(); 
            }
        }
    </script>
</body>
</html>
